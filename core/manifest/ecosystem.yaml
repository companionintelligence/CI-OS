# CI-OS ecosystem manifest — the single source of truth for "what gets installed."
#
# Every backend's provisioning script resolves this file through its own
# core/manifest/role-map/<pkgmgr>.yaml to get native package names, instead of
# hardcoding a tool list. This replaces six independently-drifted Ubuntu
# provisioning entrypoints (setup-fresh-ubuntu.sh, the ISO's embedded
# first-boot heredoc, ci-os-setup.sh, bootstrap-ci-os.sh, pull-dev.sh, and an
# orphaned preseed late_command) that had each grown their own version of this
# list. See docs/architecture/multi-distro-design.md for the full rationale.
#
# Schema: core/manifest/ecosystem.schema.json

schema_version: 1

tiers:
  core: >-
    Auto-run on first boot, and by default when a human runs provision.sh with
    no flags. The minimum for a working headless appliance.
  extended: >-
    Opt-in developer/workstation tooling. Requires --tier=extended or an
    interactive confirmation.
  hardware: >-
    Installed only when matching hardware is detected. Never flag-gated —
    gated by detection (see core/lib/gpu-detect.sh).
  reserved: >-
    Documented as part of the ecosystem but not implemented by CI-OS itself —
    owned by a separate repo. Exists so the manifest is a complete map of the
    ecosystem, not just of what this repo happens to install.

dev_tools:
  - id: docker
    tier: core
    role: containerization
    services: [docker]
    # Docker CE + compose/buildx plugins are baked into the Ubuntu ISO (customize-chroot.sh Step 10d), the live
    # user and the installer-created administrator are in the docker group, and Docker runs in live sessions
    # (docs/architecture/docker-in-live-sessions.md).
    baked_in_iso: true
  - id: uv
    tier: core
    installer: {method: curl_script, url: "https://astral.sh/uv/install.sh"}
  - id: homebrew
    tier: extended
    note: >-
      Only used today as an apt fallback path for a couple of tools; not
      required for a working appliance.
  - id: asdf
    tier: core
  - id: node
    tier: core
    version: "22.15.1"
    via: asdf
  - id: bun
    tier: extended
    note: >-
      Demoted from an inconsistent state (present in the ISO's auto-run path,
      explicitly removed from setup-fresh-ubuntu.sh with "no longer
      required"). No component in this repo requires Bun at build or run
      time — CI-Hub ships as a prebuilt Docker image, and there is no
      bun.lockb/bunfig.toml anywhere in-tree.
  # gh, cloudflared, tailscale, Ollama (llm below) and the Companion Launcher are baked into the Ubuntu ISO
  # with pinned key fingerprints / sha256 (customize-chroot.sh Step 10e, core/manifest/tier-b-pins.env,
  # docs/architecture/tier-b-tools.md). provision.sh finds them installed and skips them.
  - id: gh
    tier: core
    baked_in_iso: true
  - id: cloudflared
    tier: core
    baked_in_iso: true
  - id: vscode
    tier: extended
  - id: tailscale
    tier: core
    baked_in_iso: true
  - id: chromium
    tier: extended
  - id: telemetry_removal
    tier: core
  - id: ci_user
    tier: core
    note: "Creates the 'ci' system user, adds it to the docker group."
  - id: rocm
    tier: hardware
    hardware_match: amd_gpu_strix_halo
  - id: lact
    tier: hardware
    hardware_match: amd_gpu

llm:
  provider: ollama
  tier: core
  # The one thing that was already consistent across every entrypoint before
  # this manifest existed — preserved verbatim as the canonical list.
  models: [nomic-embed-text, "gemma3:1b", "qwen3.6:27b"]
  # The Ollama runtime itself is baked into the Ubuntu ISO (pinned release tarball, Step 10e); the models are not.
  # Companion Stick models live on the stick's CI-CACHE volume: core/manifest/model-packs.yaml (stick-128 packs).

ecosystem:
  ci_hub:
    tier: core
    display_name: "CI Hub Service"
    note: >-
      The Docker/Runtipi backend (ci-os-hub container, port 5002). Gated on
      registry auth + device pairing by design — that's a legitimate business
      requirement, not a bug. When credentials/pairing are absent, the step
      must report a single clear message and exit cleanly rather than
      attempting a silent fallback.
    registry: portal.companionintelligence.com
    image: "ci-os-hub:latest"
    requires_secrets: [REGISTRY_USERNAME, REGISTRY_PASSWORD]
    # DEVICE_ID/API_KEY are soft: core/lib/ci-hub.sh auto-generates a DEVICE_ID
    # from the system serial (or a hostname+timestamp fallback) and defaults
    # API_KEY to empty if unset — deploy proceeds without device pairing, just
    # without a verified device identity yet.
    optional_pairing: [DEVICE_ID, API_KEY]
    optional_secrets: [TUNNEL_TOKEN]
  companion_launcher:
    tier: extended
    display_name: "Companion Launcher"
    note: >-
      Renamed from "Companion Hub Desktop" to resolve the 3-way "Hub" naming
      collision (see docs/architecture/multi-distro-design.md). A native/
      Electron GUI launcher app, unrelated to the ci_hub backend above beyond
      opening a browser tab to it. Debian package and Linux binary are both
      `companion-hub` (they were `ci-os-hub-desktop` up to release v0.1.4).
      The Ubuntu ISO bakes the release pinned in core/manifest/tier-b-pins.env.
    installer: {method: external_deb, source: "https://dl.ci.computer", package: companion-hub, binary: companion-hub}
    baked_in_iso: true
  ci_server:
    tier: reserved
    implemented_here: false
    owning_repo: CI-Server
    note: >-
      CI-Server has no implementation in CI-OS and no real spec to integrate
      against yet. This entry exists so the manifest is a complete map of the
      platform's ecosystem, not an invitation to build a placeholder
      integration ahead of the real repo defining its own provisioning story.
