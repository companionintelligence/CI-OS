  - name: vision
    description: Image understanding (screenshots, documents, photos)
    models:
      - {name: gemma3, tag: 4b, digest: null, quantization: Q4_K_M,
         license: Gemma Terms of Use, size_bytes: 3350272403, min_ram_gb: 8,
