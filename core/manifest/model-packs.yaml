         license: Llama 3.3 Community License, size_bytes: 42520413916, min_ram_gb: 64,
         min_vram_gb: 48, platforms: *large}
      - {name: gpt-oss, tag: 120b, digest: null, quantization: MXFP4,
         license: Apache-2.0, size_bytes: 65369819583, min_ram_gb: 80, min_vram_gb: 80,
         platforms: *large}

  # ---- 128 GB Companion Stick packs ------------------------------------------------------
  # A 123.9 GB (115.4 GiB) stick gets a 73 GiB CI-CACHE (`ci-stick layout plan --size 123942731776`).
  # stick-128 fills it with 21 ranked models (74.36 GB, 5.1 % free on 128 KiB-cluster exFAT);
  # stick-128-oci drops the two lowest-ranked to leave 15 GiB for OCI images. The order is the rank.
  # Rationale, licences and the rejected list: docs/architecture/model-packs-128gb.md.
  - name: stick-128
    description: Ranked fill of a 128 GB stick's 73 GiB model cache (21 models)
    models:
      - &m_nomic_embed_text_latest {name: nomic-embed-text, tag: latest, digest: null,
         quantization: F16, license: Apache-2.0, size_bytes: 274302450, min_ram_gb: 2,
         min_vram_gb: null, platforms: *all}
      - &m_gemma3_1b {name: gemma3, tag: 1b, digest: null, quantization: Q4_K_M,
         license: Gemma Terms of Use, size_bytes: 806067407, min_ram_gb: 4,
         min_vram_gb: null, platforms: *all}
      - &m_qwen3_6_27b {name: qwen3.6, tag: 27b, digest: null, quantization: Q4_K_M,
         license: Apache-2.0, size_bytes: 17769076933, min_ram_gb: 32,
         min_vram_gb: 24, platforms: *large}
      - &m_qwen3_5_9b {name: qwen3.5, tag: 9b, digest: null, quantization: Q4_K_M,
         license: Apache-2.0, size_bytes: 6550825550, min_ram_gb: 16,
         min_vram_gb: null, platforms: *all}
      - &m_gemma4_e4b {name: gemma4, tag: e4b, digest: null, quantization: Q4_K_M,
         license: Apache-2.0, size_bytes: 6583656505, min_ram_gb: 16,
