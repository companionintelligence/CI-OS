# Companion Stick model packs — PROVISIONAL.
#
# "Every model" is unbounded, so a Companion Stick carries curated, named packs. Each
# model entry is exactly the `Model` record that `ci-stick lock --packs` copies into a
# bundle's bundle.json (stick/crates/ci-stick/src/manifest.rs is the schema's source of
# truth; stick/schema/bundle.schema.json mirrors it).
#
# Status: provisional. This list will be GENERATED from CI Hub's curated model catalog
# once that contract is published; until then it is hand-maintained here. The stick
# consumes Hub's catalog and `cihub models install` — it must not grow its own
# marketplace. See docs/architecture/companion-stick.md ("Model-pack policy").
#
# Rules:
# - `digest` stays null until a `ci-stick models lock` step resolves it from the
#   registry. Never type a digest by hand.
# - `size_bytes` is the approximate download size of the registry's default quantization
#   (Ollama library, decimal bytes). It becomes exact when the digest is resolved.
# - `min_ram_gb`: system RAM needed to run the model at a usable context length.
# - `min_vram_gb`: null = runs acceptably on CPU / unified memory; a number = practical
#   minimum discrete-GPU VRAM.
# - Every model already pre-pulled by core/manifest/ecosystem.yaml (llm.models) must
#   appear in some pack; `cargo test` in stick/ enforces that.
# - `license` is the licence's SPDX id or published name. "unverified" means it must be
#   confirmed from Hub's catalog before a release bundle ships.
#
# Check what fits a device:  ci-stick models list --device 512GB

schema_version: 1
status: provisional

x-platforms:
  all: &all [linux-x86_64, linux-arm64, macos-arm64, macos-x86_64, windows-x86_64]
  # Intel Macs rarely have the memory for 30B+ models; don't offer them there.
  large: &large [linux-x86_64, linux-arm64, macos-arm64, windows-x86_64]

packs:
  - name: starter
    description: Small, fast defaults for any 8 GB machine
    models:
      - {name: nomic-embed-text, tag: latest, digest: null, quantization: F16,
         license: Apache-2.0, size_bytes: 274000000, min_ram_gb: 2, min_vram_gb: null,
         platforms: *all}
      - {name: gemma3, tag: 1b, digest: null, quantization: Q4_K_M,
         license: Gemma Terms of Use, size_bytes: 815000000, min_ram_gb: 4,
         min_vram_gb: null, platforms: *all}
      - {name: llama3.2, tag: 3b, digest: null, quantization: Q4_K_M,
         license: Llama 3.2 Community License, size_bytes: 2000000000, min_ram_gb: 8,
         min_vram_gb: null, platforms: *all}
      - {name: qwen3, tag: 4b, digest: null, quantization: Q4_K_M,
         license: Apache-2.0, size_bytes: 2500000000, min_ram_gb: 8, min_vram_gb: null,
         platforms: *all}

  - name: balanced
    description: Everyday assistant quality for 16-32 GB machines
    models:
      - {name: nomic-embed-text, tag: latest, digest: null, quantization: F16,
         license: Apache-2.0, size_bytes: 274000000, min_ram_gb: 2, min_vram_gb: null,
         platforms: *all}
      - {name: qwen3, tag: 8b, digest: null, quantization: Q4_K_M,
         license: Apache-2.0, size_bytes: 5200000000, min_ram_gb: 16, min_vram_gb: null,
         platforms: *all}
      - {name: llama3.1, tag: 8b, digest: null, quantization: Q4_K_M,
         license: Llama 3.1 Community License, size_bytes: 4900000000, min_ram_gb: 16,
         min_vram_gb: null, platforms: *all}
      - {name: gemma3, tag: 12b, digest: null, quantization: Q4_K_M,
         license: Gemma Terms of Use, size_bytes: 8100000000, min_ram_gb: 16,
         min_vram_gb: null, platforms: *all}
      - {name: qwen3, tag: 14b, digest: null, quantization: Q4_K_M,
         license: Apache-2.0, size_bytes: 9300000000, min_ram_gb: 24, min_vram_gb: null,
         platforms: *all}

  - name: coding
    description: Code completion, chat and agentic coding models
    models:
      - {name: nomic-embed-text, tag: latest, digest: null, quantization: F16,
         license: Apache-2.0, size_bytes: 274000000, min_ram_gb: 2, min_vram_gb: null,
         platforms: *all}
      - {name: qwen2.5-coder, tag: 7b, digest: null, quantization: Q4_K_M,
         license: Apache-2.0, size_bytes: 4700000000, min_ram_gb: 16, min_vram_gb: null,
         platforms: *all}
      - {name: qwen3-coder, tag: 30b, digest: null, quantization: Q4_K_M,
         license: Apache-2.0, size_bytes: 19000000000, min_ram_gb: 32,
         min_vram_gb: null, platforms: *large}
      - {name: devstral, tag: 24b, digest: null, quantization: Q4_K_M,
         license: Apache-2.0, size_bytes: 14000000000, min_ram_gb: 32, min_vram_gb: 16,
         platforms: *large}
      - {name: qwen2.5-coder, tag: 32b, digest: null, quantization: Q4_K_M,
         license: Apache-2.0, size_bytes: 20000000000, min_ram_gb: 48, min_vram_gb: 24,
