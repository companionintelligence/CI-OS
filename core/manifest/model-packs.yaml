  - name: stick-128-oci
    description: stick-128 minus its 2 lowest-ranked models, keeps 15 GiB of cache free for OCI images
    models:
      - *m_nomic_embed_text_latest
      - *m_gemma3_1b
      - *m_qwen3_6_27b
      - *m_qwen3_5_9b
      - *m_gemma4_e4b
      - *m_qwen3_5_4b
      - *m_qwen2_5_coder_7b
      - *m_qwen3_vl_8b
      - *m_bge_m3_latest
      - *m_mxbai_embed_large_latest
      - *m_qwen3_embedding_0_6b
      - *m_glm_ocr_latest
      - *m_granite4_1_3b
      - *m_llama3_2_3b
      - *m_qwen3_5_2b
      - *m_qwen2_5_coder_1_5b
      - *m_functiongemma_270m
      - *m_gemma3_270m
