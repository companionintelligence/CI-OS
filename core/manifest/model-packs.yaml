      - {name: qwen3, tag: 32b, digest: null, quantization: Q4_K_M,
         license: Apache-2.0, size_bytes: 20000000000, min_ram_gb: 48, min_vram_gb: 24,
         platforms: *large}
      - {name: llama3.3, tag: 70b, digest: null, quantization: Q4_K_M,
         license: Llama 3.3 Community License, size_bytes: 43000000000, min_ram_gb: 64,
         min_vram_gb: 48, platforms: *large}
      - {name: gpt-oss, tag: 120b, digest: null, quantization: MXFP4,
         license: Apache-2.0, size_bytes: 65000000000, min_ram_gb: 80, min_vram_gb: 80,
         platforms: *large}
