         platforms: *all}
      # Licence layer carries a European Union clause (Llama 3.2 vision): review before bundling.
      - {name: llama3.2-vision, tag: 11b, digest: null, quantization: Q4_K_M,
         license: Llama 3.2 Community License, size_bytes: 7816589186, min_ram_gb: 16,
         min_vram_gb: null, platforms: *all}
      - {name: gemma3, tag: 27b, digest: null, quantization: Q4_K_M,
         license: Gemma Terms of Use, size_bytes: 17413409652, min_ram_gb: 32,
