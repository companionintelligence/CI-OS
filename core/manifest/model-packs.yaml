  # ---- appliance core --------------------------------------------------------------------
  # What core/manifest/ecosystem.yaml `llm.models` pre-pulls on a provisioned machine: the embedding
  # model, the tiny chat model and the flagship model (18.8 GB, the only one with a hardware gate).
  # It is the first three ranks of stick-128, aliased from there so each model has one set of facts;
  # a test keeps the list equal to ecosystem.yaml. It is the pack a background prefetch (off by
  # default) would fetch, and the pack the model-fit gate in docs/architecture/models-tooling.md
  # applies to.
  - name: appliance-core
    description: What ecosystem.yaml pre-pulls - embedding model, tiny chat model, flagship model (3 models)
    models:
      - *m_nomic_embed_text_latest
      - *m_gemma3_1b
      - *m_qwen3_6_27b
