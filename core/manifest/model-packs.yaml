         platforms: *all}
      - {name: llama3.1, tag: 8b, digest: null, quantization: Q4_K_M,
         license: Llama 3.1 Community License, size_bytes: 4920753328, min_ram_gb: 16,
         min_vram_gb: null, platforms: *all}
      - {name: gemma3, tag: 12b, digest: null, quantization: Q4_K_M,
         license: Gemma Terms of Use, size_bytes: 8164039732, min_ram_gb: 16,
         min_vram_gb: null, platforms: *all}
      - {name: qwen3, tag: 14b, digest: null, quantization: Q4_K_M,
         license: Apache-2.0, size_bytes: 9276198565, min_ram_gb: 24, min_vram_gb: null,
         platforms: *all}

  - name: coding
    description: Code completion, chat and agentic coding models
    models:
      - {name: nomic-embed-text, tag: latest, digest: null, quantization: F16,
         license: Apache-2.0, size_bytes: 274302450, min_ram_gb: 2, min_vram_gb: null,
