         min_vram_gb: null, platforms: *all}
      - {name: qwen2.5vl, tag: 7b, digest: null, quantization: Q4_K_M,
         license: Apache-2.0, size_bytes: 6000000000, min_ram_gb: 16, min_vram_gb: null,
         platforms: *all}
      - {name: llama3.2-vision, tag: 11b, digest: null, quantization: Q4_K_M,
         license: Llama 3.2 Community License, size_bytes: 7800000000, min_ram_gb: 16,
         min_vram_gb: null, platforms: *all}
      - {name: gemma3, tag: 27b, digest: null, quantization: Q4_K_M,
         license: Gemma Terms of Use, size_bytes: 17000000000, min_ram_gb: 32,
         min_vram_gb: 24, platforms: *large}

  - name: large
    description: Frontier-class open models for workstations with 32 GB+ RAM or a big GPU
    models:
      # From ecosystem.yaml llm.models. Size/licence to be confirmed from Hub's catalog.
      - {name: qwen3.6, tag: 27b, digest: null, quantization: Q4_K_M,
