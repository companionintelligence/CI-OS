# Companion Stick model packs — PROVISIONAL.
#
# "Every model" is unbounded, so a Companion Stick carries curated, named packs. Each
# model entry is exactly the `Model` record that `ci-stick lock --packs` copies into a
# bundle's bundle.json (stick/crates/ci-stick/src/manifest.rs is the schema's source of
# truth; stick/schema/bundle.schema.json mirrors it).
#
# Status: provisional. This list will be GENERATED from CI Hub's curated model catalog
# once that contract is published; until then it is hand-maintained here. The stick
# consumes Hub's catalog and `cihub models install` — it must not grow its own
# marketplace. See docs/architecture/companion-stick.md ("Model-pack policy").
#
# Rules:
# - `digest` stays null until a `ci-stick models lock` step resolves it from the registry. Never
#   type a digest by hand.
# - `size_bytes` is the exact byte size of the model as the Ollama registry lists it: the sum of the
#   manifest's config and layer sizes (https://registry.ollama.ai/v2/library/<name>/manifests/<tag>,
#   decimal bytes), read 2026-10-13. Registry tags are mutable, so this is a snapshot; `ci-stick models
#   lock` must pin the manifest digest. Never list `:cloud` tags (no weights) or non-GGUF `tensor` models.
#   Keep the same model ref at one size across packs (a test enforces it, for every field).
#   Once core/manifest/model-packs.lock.json exists, the lock is the authority: a test fails when a
#   size here differs from the lock by even one byte, and the sizes are then copied from the lock.
# - A Hugging Face GGUF model uses the same record, spelled the way CI Hub's catalog and Ollama
#   spell it: `name: hf.co/<org>/<repo>`, `tag: <quantization label or file name>`. There is no
#   other field for it; the repository revision, the file and its LFS sha256 live in the lock.
#   Only single-file, ungated repositories qualify. No pack lists one yet.
# - `min_ram_gb`: system RAM needed to run the model at a usable context length.
# - `min_vram_gb`: null = runs acceptably on CPU / unified memory; a number = practical
#   minimum discrete-GPU VRAM.
# - Every model already pre-pulled by core/manifest/ecosystem.yaml (llm.models) must
#   appear in some pack, and the `appliance-core` pack must list exactly those models;
#   `cargo test` in stick/ enforces both.
# - `license` is the licence's SPDX id or published name, and must have a row in
#   core/manifest/licenses.yaml (a test enforces it). "unverified" means it must be confirmed from
#   Hub's catalog before a release bundle ships: it is the explicit `release_blocking` entry of
#   that file, and `ci-stick models fetch` refuses it unless told to accept unverified licences.
#
# Check what fits a device:  ci-stick models list --device 512GB

schema_version: 1
status: provisional

x-platforms:
  all: &all [linux-x86_64, linux-arm64, macos-arm64, macos-x86_64, windows-x86_64]
  # Intel Macs rarely have the memory for 30B+ models; don't offer them there.
  large: &large [linux-x86_64, linux-arm64, macos-arm64, windows-x86_64]

packs:
  - name: starter
    description: Small, fast defaults for any 8 GB machine
    models:
      - {name: nomic-embed-text, tag: latest, digest: null, quantization: F16,
         license: Apache-2.0, size_bytes: 274302450, min_ram_gb: 2, min_vram_gb: null,
         platforms: *all}
      - {name: gemma3, tag: 1b, digest: null, quantization: Q4_K_M,
         license: Gemma Terms of Use, size_bytes: 806067407, min_ram_gb: 4,
         min_vram_gb: null, platforms: *all}
      - {name: llama3.2, tag: 3b, digest: null, quantization: Q4_K_M,
         license: Llama 3.2 Community License, size_bytes: 2019393189, min_ram_gb: 8,
         min_vram_gb: null, platforms: *all}
      - {name: qwen3, tag: 4b, digest: null, quantization: Q4_K_M,
         license: Apache-2.0, size_bytes: 2497293931, min_ram_gb: 8, min_vram_gb: null,
         platforms: *all}

  - name: balanced
    description: Everyday assistant quality for 16-32 GB machines
    models:
      - {name: nomic-embed-text, tag: latest, digest: null, quantization: F16,
         license: Apache-2.0, size_bytes: 274302450, min_ram_gb: 2, min_vram_gb: null,
