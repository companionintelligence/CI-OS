      - &m_qwen3_5_4b {name: qwen3.5, tag: 4b, digest: null, quantization: Q4_K_M,
         license: Apache-2.0, size_bytes: 3324173934, min_ram_gb: 8,
         min_vram_gb: null, platforms: *all}
      - &m_qwen2_5_coder_7b {name: qwen2.5-coder, tag: 7b, digest: null,
         quantization: Q4_K_M, license: Apache-2.0, size_bytes: 4683087561,
         min_ram_gb: 16, min_vram_gb: null, platforms: *all}
      - &m_qwen3_vl_8b {name: qwen3-vl, tag: 8b, digest: null, quantization: Q4_K_M,
         license: Apache-2.0, size_bytes: 6140415879, min_ram_gb: 16,
         min_vram_gb: null, platforms: *all}
      - &m_bge_m3_latest {name: bge-m3, tag: latest, digest: null, quantization: F16,
         license: MIT, size_bytes: 1157672605, min_ram_gb: 4, min_vram_gb: null,
         platforms: *all}
      - &m_mxbai_embed_large_latest {name: mxbai-embed-large, tag: latest,
         digest: null, quantization: F16, license: Apache-2.0, size_bytes: 669615493,
         min_ram_gb: 4, min_vram_gb: null, platforms: *all}
      - &m_qwen3_embedding_0_6b {name: qwen3-embedding, tag: 0.6b, digest: null,
         quantization: Q8_0, license: Apache-2.0, size_bytes: 639150858,
         min_ram_gb: 4, min_vram_gb: null, platforms: *all}
      # size_bytes copied from core/manifest/model-packs.lock.json (the registry re-pushed glm-ocr:latest on
      # 2026-10-14: 2219299168 -> 2655025740 bytes; stick-128 is now 74795277212 bytes). Never edit by hand:
      # re-run `ci-stick models lock` and copy; a test fails on any difference from the lock.
      - &m_glm_ocr_latest {name: glm-ocr, tag: latest, digest: null,
         quantization: F16, license: MIT, size_bytes: 2655025740, min_ram_gb: 8,
         min_vram_gb: null, platforms: *all}
