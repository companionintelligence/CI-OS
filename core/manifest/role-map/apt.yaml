# apt/dpkg role-map — translates core/manifest/ecosystem.yaml's generic dev_tools
# ids into native apt packages and repo setup. Used by the ubuntu backend
# (Companion OS on Ubuntu 26.04 LTS).
#
# The only other role-map is pacman.yaml (CachyOS, through the backends/arch engine).
# Retired 2026-10-17: dnf.yaml and bootc.yaml (restore: git checkout pre-retire-multidistro-2026-10-17 -- core/manifest/role-map/dnf.yaml)
#
# install_method:
#   apt_repo    — add a third-party apt repo (see `repo`), then apt-get install `packages`
#   apt         — apt-get install `packages` directly, no extra repo needed
#   curl_script — run the installer's own curl|sh script (url comes from ecosystem.yaml)
#   snap        — install via snap (used as a fallback for a couple of tools)
#   external_deb — download and dpkg -i a .deb from a URL resolved at install time

docker:
  install_method: apt_repo
  repo:
    key_url: "https://download.docker.com/linux/ubuntu/gpg"
    list: "deb [arch={arch} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {codename} stable"
  packages: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]

uv:
  install_method: curl_script

homebrew:
  install_method: curl_script

asdf:
  install_method: git_clone
  repo: "https://github.com/asdf-vm/asdf"
  ref: "v0.14.0"

node:
  install_method: asdf_plugin
  plugin: nodejs

bun:
  install_method: curl_script

gh:
  install_method: apt_repo
  repo:
    key_url: "https://cli.github.com/packages/githubcli-archive-keyring.gpg"
    # The vendor keyring holds two primary keys; 2C61... expired 2026-09-05. The repo is signed by this one.
    key_fingerprint: "7F38BBB59D064DBCB3D84D725612B36462313325"
    list: "deb [arch={arch} signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
  packages: [gh]

cloudflared:
  install_method: apt_repo
  repo:
    # cloudflare-main.gpg is the vendor's current key file (the old cloudflare-public-v2.gpg serves the identical file).
    key_url: "https://pkg.cloudflare.com/cloudflare-main.gpg"
    list: "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main"
    # Primary-key fingerprint, enforced by the ISO build (core/manifest/tier-b-pins.env).
    key_fingerprint: "CC94B39C77AE7342A68B89628A682D308D4E5E73"
  packages: [cloudflared]

vscode:
  install_method: external_deb
  fallback: snap

tailscale:
  install_method: apt_repo
  repo:
    key_url: "https://pkgs.tailscale.com/stable/ubuntu/{codename}.noarmor.gpg"
    key_fingerprint: "2596A99EAAB33821893C0A79458CA832957F5868"
    list_url: "https://pkgs.tailscale.com/stable/ubuntu/{codename}.tailscale-keyring.list"
  packages: [tailscale]

chromium:
  install_method: apt_repo
  fallback: [snap, flatpak]
  note: "xtradeb PPA -> snap -> flatpak fallback chain, preserved from setup-fresh-ubuntu.sh"

rocm:
  install_method: script
  script: install-rocm-driver.sh
  note: "ROCm from the Ubuntu 26.04 archive (rocm, rocminfo, rocm-smi; ROCm 7.1), inbox amdgpu, delegates to backends/ubuntu/lib/install-rocm-driver.sh"

lact:
  install_method: github_release_deb
  repo: "ilya-zlobintsev/LACT"
  # The asset is chosen by the Ubuntu series in its name (lact-<version>-<rev>.amd64.ubuntu-2604.deb): backends/ubuntu/lib/lact-release.sh.

ollama:
  install_method: curl_script
  url: "https://ollama.com/install.sh"
  # The Ubuntu ISO does not run install.sh: it installs the pinned release tarball (core/manifest/tier-b-pins.env).
