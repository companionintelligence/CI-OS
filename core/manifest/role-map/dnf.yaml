# dnf/rpm role-map — translates core/manifest/ecosystem.yaml's generic dev_tools
# ids into native dnf packages and repo setup, for backends/fedora/. Mirrors
# role-map/apt.yaml's shape and intent, but is NOT a copy: dnf's repo-add
# mechanics (dnf5's `config-manager addrepo --from-repofile=`, vs. dnf4's
# `config-manager --add-repo`, vs. plain `rpm --import` + a hand-written
# *.repo file) differ enough per tool that each entry below was verified
# against that tool's actual published Fedora packaging, not inferred from
# the apt entry. See backends/fedora/provision/provision.sh for the
# implementation this documents, and its header for the same
# confidently-correct / best-effort / gap breakdown applied per function.
#
# Like apt.yaml, this file is documentation/reference data — it is NOT
# dynamically parsed by provision.sh at runtime (verified against
# backends/ubuntu/provision/provision.sh, which hardcodes package names and
# install commands imperatively per install_<tool>() function; the Fedora
# translation follows that same actually-implemented pattern).
#
# install_method:
#   dnf_repo     — add a repo from a vendor-published *.repo file via
#                  `dnf5 config-manager addrepo --from-repofile=<url>` (dnf5)
#                  or `dnf config-manager --add-repo <url>` (dnf4/dnf-command
#                  config-manager plugin) — see ensure_config_manager_plugin()
#                  and add_repo_from_url() in provision.sh — then dnf install
#                  `packages`.
#   yum_repo     — no vendor *.repo file is fetched directly; instead
#                  `rpm --import` a GPG key and hand-write a *.repo file
#                  under /etc/yum.repos.d/, then dnf install `packages`.
#   dnf          — dnf install `packages` directly, already in Fedora's own
#                  repos, no extra repo configuration needed.
#   curl_script  — run the installer's own curl|sh script (url comes from
#                  ecosystem.yaml); verified distro-generic (see notes below).
#   git_clone    — clone a git repo at a pinned ref (asdf); not a package-
#                  manager concern, identical to apt.yaml.
#   asdf_plugin  — installed via an asdf plugin once asdf itself is present;
#                  not a system package-manager concern, identical to apt.yaml.
#   external_rpm — fallback: download and `dnf install <file>.rpm` (or
#                  `rpm -i` if that fails) a direct .rpm when the repo path
#                  is unavailable or stale.
#   shadow_utils — useradd/usermod/getent — POSIX shadow-utils commands, not
#                  a package-manager concern at all.
#   none         — no Fedora-specific action; a deliberate, documented no-op.
#   unresolved   — GAP: no confidently-researched Fedora install path exists
#                  yet. provision.sh stubs the corresponding function with a
#                  clear "not implemented for Fedora yet" log message rather
#                  than guessing at commands that could partially run and
#                  leave the system in a half-configured state.

docker:
  install_method: dnf_repo
  repo:
    repofile_url: "https://download.docker.com/linux/fedora/docker-ce.repo"
    note: >-
      Confirmed real repo at download.docker.com/linux/fedora. The repo file
      embeds $releasever/$basearch itself, so — unlike apt.yaml's docker
      entry — there is no manual codename/VERSION_ID substitution to do.
  packages: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]

uv:
  install_method: curl_script
  note: "astral.sh/uv/install.sh verified to contain zero package-manager references — fully distro-generic, works unchanged on Fedora."

homebrew:
  install_method: curl_script
  note: >-
    Core install script (Homebrew/install/HEAD/install.sh) is distro-generic,
    but its printed (non-executed) missing-build-tools hint distinguishes
    Fedora/RHEL-like distros (ID/ID_LIKE contains fedora/rhel, excluding
    amzn) via dnf group id `development-tools`. provision.sh's
    install_homebrew() runs `dnf group install -y development-tools` plus
    `procps-ng curl file git` (Fedora's package is procps-ng, not procps) as
    a prerequisite step in place of apt.yaml's build-essential/procps deps.

asdf:
  install_method: git_clone
  repo: "https://github.com/asdf-vm/asdf"
  ref: "v0.14.0"
  note: "No package manager involved; identical to apt.yaml."

node:
  install_method: asdf_plugin
  plugin: nodejs
  note: "asdf-managed; identical to apt.yaml. Prerequisite build packages differ — see provision.sh's install_asdf_nodejs_dnf_prereqs() header, marked best-effort (not covered by the Fedora packaging research this role-map is otherwise based on)."

bun:
  install_method: curl_script
  note: "Kept for parity with apt.yaml's entry even though no install_bun() exists in provision.sh (tier: extended, demoted — see ecosystem.yaml's own note; nothing in this repo requires Bun)."

gh:
  install_method: dnf_repo
  repo:
    plugin_bootstrap: "`dnf5-plugins` (dnf5) or `'dnf-command(config-manager)'` (dnf4) before the config-manager subcommand is available"
    repofile_url: "https://cli.github.com/packages/rpm/gh-cli.repo"
  packages: [gh]

cloudflared:
  install_method: dnf_repo
  repo:
    repofile_url: "https://pkg.cloudflare.com/cloudflared.repo"
    note: >-
      Confirmed generic repo file (baseurl pkg.cloudflare.com/cloudflared/rpm,
      no distro/version gating) by fetching it directly. Cloudflare rolled
      its signing key on 2025-10-30 — re-verify the key is current if GPG
      verification starts failing on this repo.
  packages: [cloudflared]

vscode:
  install_method: yum_repo
  repo:
    key_url: "https://packages.microsoft.com/keys/microsoft.asc"
    repo_file: "/etc/yum.repos.d/vscode.repo"
    baseurl: "https://packages.microsoft.com/yumrepos/vscode"
  packages: [code]
  fallback: external_rpm
  note: >-
    Microsoft's own docs note the yum repo can lag ~3h behind latest stable —
    the same rationale apt.yaml's vscode entry gives for its direct-.deb
    path. A direct-.rpm download is documented as available too, so
    provision.sh preserves the same two-tier (repo, then direct-download)
    structure Ubuntu uses, translated to .rpm.

tailscale:
  install_method: dnf_repo
  repo:
    repofile_url: "https://pkgs.tailscale.com/stable/fedora/{version_id}/tailscale.repo"
    note: >-
      {version_id} comes from /etc/os-release's VERSION_ID (e.g. "41"), NOT a
      codename — Fedora sets VERSION_ID directly and has no derivative-distro
      mismatch problem analogous to Mint/Ubuntu (see apt.yaml's tailscale
      note and provision.sh's install_tailscale() comment for that history).
      snap availability/parity on Fedora was not verified as a fallback —
      since Ubuntu's own function only falls back to apt when snap is
      missing, the Fedora version skips the snap branch entirely and goes
      straight to this repo method.
  packages: [tailscale]

chromium:
  install_method: dnf
  packages: [chromium]
  note: >-
    Simpler than Ubuntu: Chromium is in Fedora's own repos (unlike Debian/
    Ubuntu's Snap-steered transitional package), so no PPA/snap/flatpak
    fallback chain is needed. UNVERIFIED: the exact binary name Fedora's
    build exposes (`chromium` vs `chromium-browser`) — sources disagreed:
    provision.sh's chromium_usable() checks both rather than hardcoding one.

rocm:
  install_method: unresolved
  note: >-
    GAP — AMD does not publish an official Fedora ROCm repo. The only
    workable path found (a 2026 GitHub issue and community writeups) maps to
    RHEL 10's EPEL/CodeReady-Builder-equivalent repos, with reported
    ROCm 6.4.1/Fedora 42 repo-availability gaps as recently as 2025. The
    Ubuntu backend's ROCm installer pins a specific tested version (7.2.4)
    for Strix Halo hardware; no Fedora equivalent has been verified on real
    hardware. Stubbed in provision.sh with a clear "not implemented for
    Fedora yet" message rather than guessing at commands that could partially
    apply and leave the system in a half-configured state.

lact:
  install_method: unresolved
  note: >-
    GAP — not covered by the Fedora packaging research this role-map is
    based on. Ubuntu's install_lact() downloads the latest `*amd64.deb`
    asset from ilya-zlobintsev/LACT's GitHub releases API; whether that
    project publishes an .rpm (or an AppImage usable here) was not verified.
    Stubbed in provision.sh alongside rocm above, for the same reason.

ollama:
  install_method: curl_script
  url: "https://ollama.com/install.sh"
  note: >-
    Verified by downloading and reading the script: the base install (binary
    + systemd unit) is package-manager-agnostic. Its optional NVIDIA
    CUDA-driver path explicitly branches `for PACKAGE_MANAGER in dnf yum
    apt-get` with a dedicated `fedora` case (any release >=39 is treated as
    "39" for the CUDA repo) — confirms native Fedora awareness upstream, no
    Fedora-specific breakage expected.

telemetry_removal:
  install_method: none
  note: >-
    Fedora Workstation ships no equivalent to Ubuntu's
    ubuntu-report/popularity-contest/whoopsie telemetry stack — this is
    largely a non-issue on Fedora, not a gap. The closest analog is ABRT
    (Automatic Bug Reporting Tool), a local crash-collection daemon that is
    not phone-home telemetry by default; provision.sh's Fedora
    remove_telemetry() is a documented no-op, matching this. Not present in
    apt.yaml because that file only documents package-manager install
    methods; included here for ecosystem.yaml dev_tools completeness.

ci_user:
  install_method: shadow_utils
  note: >-
    `useradd -m ci` / `usermod -aG docker ci` and the `getent group` /
    `id -nG` membership checks are POSIX shadow-utils commands, not
    apt-specific — no Fedora translation needed, reused as-is. Not present
    in apt.yaml for the same reason as telemetry_removal above; included
    here for ecosystem.yaml dev_tools completeness.
