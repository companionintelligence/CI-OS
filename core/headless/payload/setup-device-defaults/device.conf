# Setup Device Configuration

# Serial suffix for SSID (will be read from system)
# If not set, will use last 6 characters of machine-id
SERIAL_SUFFIX=

# Setup network configuration
SETUP_NETWORK=192.168.99.0/24
SETUP_GATEWAY=192.168.99.1

# Pairing code file location
PAIRING_CODE_FILE=/var/lib/setup-device/pairing-code

# Setup complete flag
SETUP_COMPLETE_FILE=/var/lib/setup-device/setup-complete

# Credentials storage
CREDENTIALS_FILE=/var/lib/setup-device/credentials

# Log file
LOG_FILE=/var/log/setup-backend.log

# Cloud API base URL. Unset, the service pairs against the production Portal, https://hub.ci.computer
# To pair against another Portal (staging, dev), uncomment this line and set that Portal's base URL.
# The environment variable of the same name wins over this file.
# CI_CLOUD_API_URL=https://hub.ci.computer
# The service will append /api/devices/pair to this URL

# CI Zone ID for companionintelligence.com (used by Companion Hub after setup)
CI_ZONE_ID=2b77d4360dbd4a9ccdad5c8d947323c9

