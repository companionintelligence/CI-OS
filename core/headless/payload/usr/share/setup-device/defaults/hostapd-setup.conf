# HostAPD configuration for setup mode hotspot
# Hardware: Mediatek MT7925 WiFi 6 Dual-Band Module
# Driver: nl80211 (Linux wireless extensions)
#
# DEFAULT ONLY. /usr/local/bin/setup-device-hotspot-start.sh writes this file again at every start, with
# the Wi-Fi interface it detected (one that supports AP mode, per `iw`), a fresh SSID and, when it is known,
# the regulatory country. The interface below is the reference board's; nothing starts hostapd-setup at boot.
interface=wlp192s0
driver=nl80211

# SSID - Companion Device Setup
ssid=Companion-Setup

# WPA2-PSK only (change password for production)
wpa=2
wpa_passphrase=SetupDevice123
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP

# 2.4 GHz (optimal for compatibility and range)
# MT7925 supports: 2.4 GHz (channels 1-13) and 5 GHz (channels 36-165)
# Channel 6 is a widely-used non-overlapping channel (1, 6, 11 are standard)
hw_mode=g
channel=6

# Max clients (MT7925 supports 10+)
max_num_sta=10

# Clients of the setup network can reach the device, not each other
ap_isolate=1

# Country code (affects allowed channels and power levels): deliberately not set here. The start script
# adds country_code (and ieee80211d) from /etc/setup-device/regdom, ci.country=XX on the kernel command line
# or `iw reg get` when one of them names a country; with none, the kernel's world domain applies and
# channel 6 above is legal everywhere.

# IEEE 802.11n (enable for better performance with modern devices)
ieee80211n=1
ht_capab=[SHORT-GI-20]

# WiFi 6 support if supported by hardware
ieee80211ax=0

# Disable WPS for security
wps_state=0

# Logging
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2
