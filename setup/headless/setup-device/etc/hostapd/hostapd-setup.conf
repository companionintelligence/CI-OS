# HostAPD configuration for setup mode hotspot
interface=wlan0
driver=nl80211

# SSID with serial suffix (will be replaced by script)
ssid=Setup-Device-UNKNOWN

# WPA2-PSK only
wpa=2
wpa_passphrase=SetupDevice123
wpa_key_mgmt=WPA-PSK
wpa_pairwise=TKIP CCMP
rsn_pairwise=CCMP

# 2.4 GHz
hw_mode=g
channel=6

# Max clients
max_num_sta=10

# Country code (adjust as needed)
country_code=US

# IEEE 802.11n
ieee80211n=1

# Logging
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2
