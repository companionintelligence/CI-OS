# DNSmasq configuration for setup portal
# This file is only active when dnsmasq-setup.service is running

# Interface binding
interface=wlp192s0
bind-interfaces

# DHCP configuration
dhcp-range=192.168.99.10,192.168.99.250,255.255.255.0,12h
dhcp-option=3,192.168.99.1
dhcp-option=6,192.168.99.1

# Force DNS to gateway
dhcp-option=option:dns-server,192.168.99.1

# Upstream DNS for external domains (needed for CI Cloud registration from AP)
# Device shares internet via eth0; clients need to reach setup.companionintelligence.com
server=8.8.8.8
server=1.1.1.1
no-resolv
no-poll

# Redirect captive detection domains to gateway (triggers portal popup)
address=/setup.ci.computer/192.168.99.1
address=/captive.apple.com/192.168.99.1
address=/gstatic.com/192.168.99.1
address=/www.msftconnecttest.com/192.168.99.1
address=/connectivitycheck.gstatic.com/192.168.99.1
address=/clients3.google.com/192.168.99.1
address=/www.google.com/192.168.99.1

# Logging
log-queries
log-facility=/var/log/dnsmasq-setup.log
