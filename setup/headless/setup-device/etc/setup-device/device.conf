# Setup Device Configuration

# Serial suffix for SSID (will be read from system)
# If not set, will use last 6 characters of machine-id
SERIAL_SUFFIX=

# Setup network configuration
SETUP_NETWORK=192.168.99.0/24
SETUP_GATEWAY=192.168.99.1

# Pairing code file location
PAIRING_CODE_FILE=/var/lib/setup-device/pairing-code

# Setup complete flag
SETUP_COMPLETE_FILE=/var/lib/setup-device/setup-complete

# Credentials storage
CREDENTIALS_FILE=/var/lib/setup-device/credentials

# Log file
LOG_FILE=/var/log/setup-backend.log

# Cloud API base URL (no trailing slash). Example:
CI_CLOUD_API_URL=https://setup.companionintel.com
# If empty, the service will fall back to https://setup.companionintel.com
# The service will append /api/devices/pair and /store/ci-os-hub/install to this URL.

# Optional: Docker registry credentials for pulling CI-OS-Hub image.
# Required if the registry uses basic auth; leave unset if using device-scoped registry auth.
# REGISTRY_USERNAME=
# REGISTRY_PASSWORD=

