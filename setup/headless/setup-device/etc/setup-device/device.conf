# Setup Device Configuration

# Serial suffix for SSID (will be read from system)
# If not set, will use last 6 characters of machine-id
SERIAL_SUFFIX=

# Setup network configuration
SETUP_NETWORK=192.168.99.0/24
SETUP_GATEWAY=192.168.99.1

# Pairing code file location
PAIRING_CODE_FILE=/var/lib/setup-device/pairing-code

# Setup complete flag
SETUP_COMPLETE_FILE=/var/lib/setup-device/setup-complete

# Credentials storage
CREDENTIALS_FILE=/var/lib/setup-device/credentials

# Log file
LOG_FILE=/var/log/setup-backend.log
