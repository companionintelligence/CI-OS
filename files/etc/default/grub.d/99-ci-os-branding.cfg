# GRUB configuration for CI-OS
# Dark green theme branding

GRUB_DEFAULT=0
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=5
GRUB_DISTRIBUTOR="CI-OS"
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
GRUB_CMDLINE_LINUX=""

# CI-OS Dark Green Branding
GRUB_TERMINAL_OUTPUT="gfxterm"
GRUB_GFXMODE=1920x1080
GRUB_GFXPAYLOAD_LINUX=keep

# Color scheme - Dark Green Theme
# Format: foreground/background
GRUB_COLOR_NORMAL="light-cyan/black"
GRUB_COLOR_HIGHLIGHT="white/cyan"

# Boot menu appearance
GRUB_BACKGROUND="/usr/share/pixmaps/ci-os-grub-bg.png"

# Disable submenu for cleaner appearance
GRUB_DISABLE_SUBMENU=y

# Recovery mode
GRUB_DISABLE_RECOVERY="false"

# Terminal settings
GRUB_TERMINAL=console
