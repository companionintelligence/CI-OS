<?xml version="1.0" encoding="UTF-8"?>
<svg width="3840" height="2160" viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#066c80"/>
      <stop offset="50%" style="stop-color:#00a9a7"/>
      <stop offset="100%" style="stop-color:#072734"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#72ddd4;stop-opacity:0.3"/>
      <stop offset="70%" style="stop-color:#00a9a7;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#066c80;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background gradient -->
  <rect width="3840" height="2160" fill="url(#background)"/>
  
  <!-- Center glow -->
  <rect width="3840" height="2160" fill="url(#centerGlow)"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#72ddd4" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="3840" height="2160" fill="url(#grid)"/>
  
  <!-- Central CI logo placeholder -->
  <g transform="translate(1920, 1080)">
    <!-- Large subtle CI-OS text -->
    <text x="0" y="-200" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="120" font-weight="300" fill="#72ddd4" opacity="0.3">CI-OS</text>
    <text x="0" y="-60" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="200" fill="#00a9a7" opacity="0.4">Linux for AI</text>
    
    <!-- Companion Intelligence branding -->
    <text x="0" y="300" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="300" fill="#72ddd4" opacity="0.6">Companion Intelligence</text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="400" cy="400" r="2" fill="#72ddd4" opacity="0.4"/>
  <circle cx="3440" cy="1760" r="3" fill="#00a9a7" opacity="0.3"/>
  <circle cx="200" cy="1800" r="1.5" fill="#72ddd4" opacity="0.5"/>
  <circle cx="3600" cy="300" r="2.5" fill="#00a9a7" opacity="0.4"/>
</svg>