<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#2563EB" stroke="#1E40AF" stroke-width="2"/>
  
  <!-- CI Letters -->
  <text x="100" y="120" font-family="Arial, sans-serif" font-size="72" font-weight="bold" 
        text-anchor="middle" fill="white">CI</text>
  
  <!-- OS Text -->
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="normal" 
        text-anchor="middle" fill="#E5E7EB">OS</text>
  
  <!-- Circuit Pattern -->
  <g stroke="#60A5FA" stroke-width="2" fill="none" opacity="0.3">
    <path d="M20 50 L50 50 L50 30 L80 30"/>
    <path d="M120 30 L150 30 L150 50 L180 50"/>
    <path d="M20 150 L50 150 L50 170 L80 170"/>
    <path d="M120 170 L150 170 L150 150 L180 150"/>
    <circle cx="50" cy="50" r="3" fill="#60A5FA"/>
    <circle cx="150" cy="50" r="3" fill="#60A5FA"/>
    <circle cx="50" cy="150" r="3" fill="#60A5FA"/>
    <circle cx="150" cy="150" r="3" fill="#60A5FA"/>
  </g>
</svg>
