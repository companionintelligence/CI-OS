<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <radialGradient id="backgroundGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </radialGradient>
    
    <pattern id="circuitPattern" patternUnits="userSpaceOnUse" width="100" height="100">
      <g stroke="#60A5FA" stroke-width="1" fill="none" opacity="0.1">
        <path d="M0 50 L25 50 L25 25 L50 25 L50 0"/>
        <path d="M50 100 L75 100 L75 75 L100 75 L100 50"/>
        <circle cx="25" cy="50" r="2" fill="#60A5FA"/>
        <circle cx="75" cy="75" r="2" fill="#60A5FA"/>
      </g>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#backgroundGradient)"/>
  
  <!-- Circuit pattern overlay -->
  <rect width="1920" height="1080" fill="url(#circuitPattern)"/>
  
  <!-- Main logo -->
  <g transform="translate(960, 540)">
    <!-- Logo background circle -->
    <circle cx="0" cy="0" r="120" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    
    <!-- CI Letters -->
    <text x="0" y="30" font-family="Ubuntu, Arial, sans-serif" font-size="96" font-weight="bold" 
          text-anchor="middle" fill="white">CI</text>
    
    <!-- OS Text -->
    <text x="0" y="80" font-family="Ubuntu, Arial, sans-serif" font-size="32" font-weight="normal" 
          text-anchor="middle" fill="rgba(255,255,255,0.8)">OS</text>
  </g>
  
  <!-- Decorative elements -->
  <g stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none">
    <!-- Left side -->
    <path d="M200 400 L400 400 L400 300 L600 300"/>
    <path d="M200 680 L400 680 L400 780 L600 780"/>
    <circle cx="400" cy="400" r="4" fill="rgba(255,255,255,0.3)"/>
    <circle cx="400" cy="680" r="4" fill="rgba(255,255,255,0.3)"/>
    
    <!-- Right side -->
    <path d="M1720 400 L1520 400 L1520 300 L1320 300"/>
    <path d="M1720 680 L1520 680 L1520 780 L1320 780"/>
    <circle cx="1520" cy="400" r="4" fill="rgba(255,255,255,0.3)"/>
    <circle cx="1520" cy="680" r="4" fill="rgba(255,255,255,0.3)"/>
  </g>
  
  <!-- Bottom tagline -->
  <text x="960" y="900" font-family="Ubuntu, Arial, sans-serif" font-size="24" font-weight="normal" 
        text-anchor="middle" fill="rgba(255,255,255,0.7)">
    Custom Ubuntu Distribution for Continuous Integration and Development
  </text>
</svg>
