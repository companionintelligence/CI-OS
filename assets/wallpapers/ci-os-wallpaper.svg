<?xml version="1.0" encoding="UTF-8"?>
<!-- On-brand fallback wallpaper: only used by scripts/customize-chroot.sh if
     core/render/inputs/background.png is missing at chroot-build time. Kept
     deliberately simple (a canon-token gradient, no logo reproduction) since
     this path is rarely hit — see docs/architecture/multi-distro-design.md. -->
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ciBackgroundGradient" cx="50%" cy="45%" r="75%">
      <stop offset="0%" style="stop-color:#073038;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#021018;stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#ciBackgroundGradient)" />
</svg>
