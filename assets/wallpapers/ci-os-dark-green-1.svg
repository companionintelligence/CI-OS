<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="bg-gradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#0a4f3c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#066c80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#033d4a;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#72ddd4;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#00a9a7;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#066c80;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg-gradient)"/>
  
  <!-- Geometric patterns -->
  <g opacity="0.1">
    <circle cx="300" cy="200" r="150" fill="#72ddd4"/>
    <circle cx="1600" cy="800" r="200" fill="#00a9a7"/>
    <circle cx="800" cy="900" r="120" fill="#72ddd4"/>
  </g>
  
  <!-- Subtle grid overlay -->
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#72ddd4" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  
  <!-- Central accent element -->
  <g transform="translate(960,540)">
    <circle r="300" fill="url(#accent-gradient)"/>
    <!-- CI-OS logo placeholder - could be replaced with actual logo -->
    <g transform="scale(2,2)" opacity="0.3">
      <circle r="60" fill="none" stroke="#72ddd4" stroke-width="2"/>
      <circle r="45" fill="none" stroke="#00a9a7" stroke-width="1.5"/>
      <circle r="30" fill="none" stroke="#72ddd4" stroke-width="1"/>
      <text x="0" y="8" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#72ddd4">CI</text>
    </g>
  </g>
  
  <!-- Bottom brand text -->
  <text x="960" y="1020" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="300" fill="#72ddd4" opacity="0.6">
    CI-OS · Custom Linux for Developers
  </text>
</svg>