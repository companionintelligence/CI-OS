# NVIDIA-specific Proton configuration
# Optimized settings for NVIDIA GPU acceleration

# NVIDIA environment variables for Proton
export __GL_SHADER_DISK_CACHE=1
export __GL_THREADED_OPTIMIZATIONS=1
export NVIDIA_DRIVER_CAPABILITIES=all
export __GL_SYNC_TO_VBLANK=0

# DXVK NVIDIA optimizations
export DXVK_HUD="fps,memory"
export DXVK_NVAPI_DRIVER_VERSION=52.117
export DXVK_ENABLE_NVAPI=1

# VKD3D NVIDIA settings
export VKD3D_CONFIG=upload_hvv
export VKD3D_FEATURE_LEVEL=12_1

# Ray tracing support (if available)
export PROTON_ENABLE_RTX=1