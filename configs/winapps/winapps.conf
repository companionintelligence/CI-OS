# WinApps Configuration for CI-OS
# Seamless Windows application integration

# WinApps main configuration
WINAPPS_DOCKER_IMAGE="ci-os:latest"
WINAPPS_DOCKER_ARGS="--rm -it"
WINAPPS_VOLUME_MAPPING=true
WINAPPS_HOME_INTEGRATION=true

# Common Windows applications to integrate
APPS=(
    "notepad"
    "calc"
    "winver"
    "regedit"
)

# Application definitions directory
APP_DEFINITIONS_DIR="/etc/winapps/apps"

# Desktop integration
DESKTOP_INTEGRATION=true
MENU_INTEGRATION=true