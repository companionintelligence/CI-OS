# Proton Helpers Configuration
# Version management and helper scripts for Proton compatibility

# Pinned Proton versions (update these as needed)
PROTON_STABLE_VERSION="8.0-3"
PROTON_EXPERIMENTAL_VERSION="experimental_bleeding_edge"

# Proton installation paths
PROTON_INSTALL_DIR="/opt/proton"
STEAM_COMPAT_DIR="/home/deck/.steam/steam/steamapps/common"

# Helper script configurations
PROTON_LOG_ENABLED=true
PROTON_LOG_DIR="/var/log/proton"

# Default Proton settings for non-Steam applications
export STEAM_COMPAT_DATA_PATH="/home/deck/.steam/steam/steamapps/compatdata"
export STEAM_COMPAT_CLIENT_INSTALL_PATH="/home/deck/.steam/steam"

# Wine compatibility settings
export WINE_LARGE_ADDRESS_AWARE=1
export WINE_CPU_TOPOLOGY="4:2"