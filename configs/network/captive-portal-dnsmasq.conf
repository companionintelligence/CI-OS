# DNS Hijacking Configuration for Captive Portal
# This file should be placed in /etc/NetworkManager/dnsmasq-shared.d/
# when the provisioning system activates the hotspot.
#
# The 'address' directive resolves ALL DNS queries to the gateway IP (10.42.0.1),
# forcing clients to interact with the captive portal web server.

# Wildcard: Resolve all domains to the gateway
address=/#/10.42.0.1

# Disable upstream DNS forwarding to ensure complete DNS control
no-resolv

# Increase DNS cache size for better performance
cache-size=1000

# Log DNS queries for debugging (disable in production)
# log-queries
# log-dhcp
