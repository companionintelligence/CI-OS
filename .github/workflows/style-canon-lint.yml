name: Style canon lint

# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on: [pull_request, push]
# <<< ci-local:gated
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read   # the job installs @companionintelligence/config from the GitHub package registry with the workflow token

jobs:
  style-canon-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@companionintelligence'
      # No npm project here: the gate is the ci-lint-canon bin of @companionintelligence/config,
      # pointed at the vendored canon (brand bundle) so it needs no tokens install.
      - run: npx --yes --package @companionintelligence/config ci-lint-canon . --tokens vendor/brand/tokens/tokens.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: core/lib/vendor-brand.sh --check
      - run: core/lib/check-brand-mirrors.sh
      - run: >-
          bash -n backends/_mixins/gnome-dconf/*.sh backends/_mixins/kde-plasma/*.sh
          backends/ubuntu/desktop-theme/*.sh core/render/*.sh core/lib/*.sh
          backends/ubuntu/iso/scripts/build-gdm-branding-gresource.sh
          backends/ubuntu/chroot/customize-chroot.sh
