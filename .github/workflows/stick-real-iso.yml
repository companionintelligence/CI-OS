name: Companion Stick real-ISO smoke test

# Manual only. Flashes a real Ubuntu 26.04 desktop ISO (or a CI-OS ISO built by
# build-companion-os-iso.yml) into a sparse 64 GB stick image with the production
# grub.cfg, then boots it in QEMU as a USB stick under UEFI until casper has started.
# The ISO is only used after its SHA256SUMS signature verifies against Ubuntu's CD image
# signing key (fingerprint pinned below) and its sha256 matches.
on:
  workflow_dispatch:
    inputs:
      ubuntu_release_dir:
        description: 'releases.ubuntu.com directory holding the desktop ISO + SHA256SUMS'
        required: true
        default: '26.04'
      ci_os_run_id:
        description: 'Optional: run id of build-companion-os-iso.yml whose ISO artifact to use instead'
        required: false
        default: ''
      ci_os_artifact:
        description: 'Artifact name in that run (with ci_os_run_id)'
        required: false
        default: 'ci-os-iso'

permissions:
  contents: read
  actions: read

env:
  # Ubuntu CD Image Automatic Signing Key (2012) <cdimage@ubuntu.com>
  UBUNTU_CD_KEY_FPR: 843938DF228D22F7B3742BC0D94AA3F0EFE21092

jobs:
  real-iso:
    # The runner image is only the QEMU/KVM host; the image that boots in QEMU is the Ubuntu 26.04 ISO.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf grub-efi-amd64-bin grub-common \
            gdisk dosfstools mtools exfatprogs e2fsprogs gnupg curl
      - name: Build ci-stick
        working-directory: stick
        run: cargo build --release --locked

      - name: Fetch a CI-OS ISO artifact
        if: inputs.ci_os_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.ci_os_artifact }}
          run-id: ${{ inputs.ci_os_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ci-os-iso

      - name: Download and verify the Ubuntu desktop ISO
        if: inputs.ci_os_run_id == ''
        env:
          REL: ${{ inputs.ubuntu_release_dir }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://releases.ubuntu.com/$REL"
          curl -fsSLO "$base/SHA256SUMS"
          curl -fsSLO "$base/SHA256SUMS.gpg"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m 700 -p "$GNUPGHOME"
          gpg --batch --keyserver hkps://keyserver.ubuntu.com --recv-keys "$UBUNTU_CD_KEY_FPR"
          # Accept only a good signature made by the pinned key.
          gpg --batch --status-fd 1 --verify SHA256SUMS.gpg SHA256SUMS \
            | tee gpg.status | grep -q "^\[GNUPG:\] VALIDSIG $UBUNTU_CD_KEY_FPR " \
            || { echo "SHA256SUMS signature is not from $UBUNTU_CD_KEY_FPR"; cat gpg.status; exit 1; }
          # The directory lists every point release (26.04's SHA256SUMS has both
          # ubuntu-26.04-desktop-amd64.iso and ubuntu-26.04.1-desktop-amd64.iso, the older first):
          # take the newest by version, not the first line.
          iso="$(grep -oE '[^ *]+desktop-amd64\.iso$' SHA256SUMS | sort -V | tail -n1)"
          [ -n "$iso" ] || { echo "no desktop-amd64 ISO in SHA256SUMS"; exit 1; }
          echo "using $iso"
          curl -fSL --retry 3 -o "$iso" "$base/$iso"
          grep " \*\?$iso\$" SHA256SUMS | sha256sum -c -
          mkdir -p ci-os-iso && mv "$iso" ci-os-iso/

      - name: Stage, lock, dev-sign and flash a 64 GB image
        run: |
          set -euo pipefail
          CI="$GITHUB_WORKSPACE/stick/target/release/ci-stick"
          iso="$(ls "$RUNNER_TEMP"/ci-os-iso/*.iso | head -n1)"
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/boot" "$stage/efi"
          mv "$iso" "$stage/boot/$(basename "$iso")"
          stick/scripts/build-grub-efi.sh "$stage/efi/BOOTX64.EFI"
          "$CI" lock "$stage" --id companion-stick-real-iso --version "smoke-$GITHUB_RUN_ID" --size 64GB
          "$CI" dev keygen --out "$RUNNER_TEMP/dev"
          "$CI" dev sign "$stage" --key "$RUNNER_TEMP/dev.key"
          # loglevel=7 after the production "quiet" so the serial log shows the kernel
          # command line and casper's progress.
          "$CI" flash "$stage" --pubkey "$RUNNER_TEMP/dev.pub" \
            --image "$RUNNER_TEMP/stick.img" --size 64GB --work-dir "$RUNNER_TEMP" \
            --extra-cmdline "console=ttyS0,115200 loglevel=7"
          rm -rf "$stage/boot"   # the stick image holds it now; free the space

      - name: Boot in QEMU until casper starts
        run: |
          set -uo pipefail
          cp /usr/share/OVMF/OVMF_VARS_4M.fd "$RUNNER_TEMP/vars.fd"
          accel=tcg; [ -w /dev/kvm ] && accel=kvm
          log="$RUNNER_TEMP/serial.log"
          timeout 1500 qemu-system-x86_64 -machine q35 -m 4096 -smp 2 -accel "$accel" \
            -display none -monitor none -no-reboot -net none -serial "file:$log" \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive "if=pflash,format=raw,file=$RUNNER_TEMP/vars.fd" \
            -device qemu-xhci,id=xhci \
            -drive "if=none,id=stick,format=raw,file=$RUNNER_TEMP/stick.img" \
            -device usb-storage,bus=xhci.0,drive=stick,bootindex=0 &
          qpid=$!
          ok=0
          for _ in $(seq 1 280); do
            sleep 5
            if tr -d '\r' < "$log" | grep -aqE 'Command line:.*boot=casper.*ci_stick\.slot=A' \
               && tr -d '\r' < "$log" | grep -aqE 'systemd\[1\]|Welcome to|casper'; then
              ok=1; break
            fi
            kill -0 "$qpid" 2>/dev/null || break
          done
          kill "$qpid" 2>/dev/null; wait "$qpid" 2>/dev/null
          tr -d '\r' < "$log" | grep -aE 'Command line:|casper|systemd\[1\]|Welcome to' | head -n 40
          if [ "$ok" -eq 1 ]; then
            echo "PASS: the real ISO booted from CI-BOOT-A via the stick's grub.cfg and casper started"
          else
            echo "FAIL: did not see the casper kernel command line and early userspace on the serial console"
            tail -c 8000 "$log" | tr -d '\r'
            exit 1
          fi

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stick-real-iso-serial
          path: ${{ runner.temp }}/serial.log
          if-no-files-found: ignore
