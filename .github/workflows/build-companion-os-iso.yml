name: Build Companion OS ISO

# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   workflow_dispatch:
#     inputs:
#       version:
#         description: 'CI-OS version (e.g., 1.0, 1.1)'
#         required: true
#         default: '1.0'
#       sign:
#         description: 'Sign checksums with GPG'
#         required: false
#         type: boolean
#         default: false
#   push:
#     tags:
#       - 'v*'
#   schedule:
#     # Build ISOs weekly on Sundays at 2 AM UTC
#     - cron: "0 2 * * 0"
# <<< ci-local:gated
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'CI-OS version (e.g., 1.0, 1.1)'
        required: true
        default: '1.0'
      sign:
        description: 'Sign checksums with GPG'
        required: false
        type: boolean
        default: false

env:
  # Companion OS is built on Ubuntu 26.04.1 LTS (Resolute Raccoon) only; 24.04 is retired.
  UBUNTU_VERSION: "26.04"
  UBUNTU_CODENAME: "resolute"
  BASE_ISO_URL: "https://releases.ubuntu.com/26.04/ubuntu-26.04.1-desktop-amd64.iso"
  # sha256 of that ISO. Every run also checks it against Ubuntu's signed SHA256SUMS, so a changed
  # ISO is a failed build; bump this value deliberately when the base ISO is bumped.
  # A bump (a point release, 26.04.2) is not a one-line change: the split table and verify-iso.sh name stock paths
  # literally, and nothing fails by itself when a new stock live layer gains a live-only file (that is how the polkit
  # rule, the sysctl file and the encryption seed went unnoticed on 26.04.1). Before changing the pin, on the new ISO,
  # in an ubuntu:26.04 container (commands in the headers of the tests):
  #   - backends/ubuntu/iso/tests/split-live-layer.sh Part B, group B1: every live-only path of the new live layer
  #     is in the removal table or is generated state of a package that stays;
  #   - CI_TEST_STOCK_ISO=<iso> backends/ubuntu/iso/tests/grub-live-menu-modules.sh (G4) and
  #     CI_TEST_STOCK_ISO=<iso> backends/ubuntu/iso/tests/md5sum-txt.sh: the signed GRUB's built-in modules and the
  #     md5sum.txt convention are still the committed ones (stick/scripts/fetch-signed-boot.sh re-reads the disk image's);
  #   - CI_TEST_STOCK_INITRD=<its casper/initrd> backends/ubuntu/iso/tests/boot-media-plymouth.sh: the initrd shape,
  #     the .disk/info line and casper's launcher-label lines;
  #   - then one real build, verify-iso.sh with VERIFY_BASE_ISO (it also checks that the image fits an 8 GiB Stick slot).
  BASE_ISO_SHA256: "601e30fbf5d97759367c632e2c33630665039b7e2158fd068403da3ccf1bda1f"
  # Ubuntu CD Image Automatic Signing Key (2012) <cdimage@ubuntu.com>, signer of SHA256SUMS.gpg.
  UBUNTU_CD_KEY_FPR: "843938DF228D22F7B3742BC0D94AA3F0EFE21092"
  # Where the image is built. The runner is only the host (Docker, disk, artifacts); the build runs in
  # this privileged container so that the build host is Ubuntu 26.04 whatever the runner image is
  # (Yaru theme and GNOME 50 resources, initramfs-tools 0.151 with its unmkinitramfs, squashfs-tools, ...).
  BUILD_IMAGE: "ubuntu:26.04"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    # Host only: nothing of the image is built or read on the runner itself (see BUILD_IMAGE).
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      # The `secrets` context is not available in a step-level `if:` (GitHub rejects the
      # whole workflow file), so the signing step tests this job-level flag instead.
      GPG_KEY_PRESENT: ${{ secrets.GPG_PRIVATE_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          # Remove unnecessary packages and files
          sudo apt-get remove -y \
            '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' \
            azure-cli google-chrome-stable firefox powershell mono-devel || true
          sudo apt-get autoremove -y
          sudo apt-get clean

          # Remove large directories
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL || true

          echo "Disk space after cleanup:"
          df -h

      - name: Start the Ubuntu 26.04 build container
        run: |
          # Privileged for loop and overlay mounts, mknod whiteouts and chroot. The repository, the base ISO
          # (read-only) and the output live on the host disk, never in the container's own layer: overlayfs
          # needs a real filesystem under its upperdir.
          mkdir -p "$RUNNER_TEMP/base"
          docker run -d --name ci-os-build --privileged \
            -v "$GITHUB_WORKSPACE":/work \
            -v "$RUNNER_TEMP/base":/base:ro \
            -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            "$BUILD_IMAGE" sleep infinity
          # A container's /dev only holds the loop nodes that existed when it started, while `mount -o loop`
          # takes the first free loop device (more than the runner's snap loops). Make plenty of nodes here,
          # in the container's private /dev.
          docker exec ci-os-build bash -euc '
            for i in $(seq 0 127); do [ -e /dev/loop$i ] || mknod -m 0660 /dev/loop$i b 7 $i; done
            [ -e /dev/loop-control ] || mknod -m 0660 /dev/loop-control c 10 237
            . /etc/os-release && echo "build container: $PRETTY_NAME ($VERSION_CODENAME)"'

      - name: Install dependencies (in the container)
        run: |
          docker exec -e UBUNTU_CODENAME ci-os-build bash -euo pipefail -c '
            . /etc/os-release
            [ "$VERSION_CODENAME" = "$UBUNTU_CODENAME" ] \
              || { echo "the build container is $VERSION_CODENAME, expected $UBUNTU_CODENAME"; exit 1; }
            apt-get update
            apt-get install -y \
              ca-certificates \
              debootstrap \
              squashfs-tools \
              xorriso \
              rsync \
              gpg \
              curl \
              cpio \
              zstd \
              initramfs-tools-core \
              imagemagick \
              librsvg2-bin \
              libglib2.0-bin \
              libglib2.0-dev-bin \
              yaru-theme-gnome-shell \
              python3 \
              python3-yaml \
              diffutils \
              mount \
              util-linux'

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix
          else
            VERSION="1.0-$(date +%Y%m%d)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building CI-OS version: $VERSION"

      - name: Download and verify the base Ubuntu ISO
        run: |
          set -euo pipefail
          echo "Downloading Ubuntu ${UBUNTU_VERSION} (${UBUNTU_CODENAME}) Desktop ISO..."
          iso_name="${BASE_ISO_URL##*/}"
          dir_url="${BASE_ISO_URL%/*}"
          cd "$RUNNER_TEMP/base"

          # 1. Ubuntu's SHA256SUMS, accepted only with a good signature made by the pinned CD image key.
          curl -fsSL --retry 3 -O "$dir_url/SHA256SUMS" -O "$dir_url/SHA256SUMS.gpg"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
          gpg --batch --keyserver hkps://keyserver.ubuntu.com --recv-keys "$UBUNTU_CD_KEY_FPR"
          gpg --batch --status-fd 1 --verify SHA256SUMS.gpg SHA256SUMS | tee gpg.status >/dev/null || true
          # VALIDSIG <signing key fpr> ... <primary key fpr>: the pinned key may be either.
          awk -v want="$UBUNTU_CD_KEY_FPR" '$2 == "VALIDSIG" && ($3 == want || $NF == want) { ok = 1 } END { exit !ok }' gpg.status \
            || { echo "SHA256SUMS is not signed by $UBUNTU_CD_KEY_FPR:"; cat gpg.status; exit 1; }

          # 2. The line for exactly this ISO must carry the pinned sha256.
          grep -F -- " *$iso_name" SHA256SUMS > iso.sha256 || { echo "$iso_name is not in Ubuntu's SHA256SUMS"; exit 1; }
          [ "$(wc -l < iso.sha256)" -eq 1 ] || { echo "more than one SHA256SUMS line for $iso_name"; exit 1; }
          signed="$(cut -d' ' -f1 iso.sha256)"
          [ "$signed" = "$BASE_ISO_SHA256" ] \
            || { echo "Ubuntu's signed SHA256SUMS says $signed for $iso_name; the workflow pins $BASE_ISO_SHA256"; exit 1; }

          # 3. Download, then check the bytes against the signed line.
          curl -fSL --retry 3 -o "$iso_name" "$BASE_ISO_URL"
          sha256sum -c iso.sha256
          mv "$iso_name" ubuntu-base.iso
          ls -lh ubuntu-base.iso

      - name: Build CI-OS ISO (in the container)
        env:
          CI_OS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Building CI-OS $CI_OS_VERSION..."

          docker exec -e CI_OS_VERSION ci-os-build \
            ./backends/ubuntu/iso/scripts/build-iso.sh \
            --base-iso /base/ubuntu-base.iso \
            --output-dir ./output \
            --work-dir ./work \
            --version "$CI_OS_VERSION" \
            --clean

      - name: Verify the image (pre-installed tools and branding, in the container)
        run: |
          # The stock ISO the image was built from: with it verify-iso.sh also checks that the Secure Boot binaries and the
          # initrd's stock bytes are untouched and that the md5sum.txt exclusions are the stock ISO's own.
          # Fails the build if any CI-Hub / wireless setup tool is missing or the branding regressed.
          docker exec -e VERIFY_BASE_ISO=/base/ubuntu-base.iso ci-os-build sh -c \
            './backends/ubuntu/iso/scripts/verify-iso.sh output/companion-os-*.iso'

      - name: Stop the build container and hand the output to the runner user
        if: always()
        run: |
          # The build wrote as root into the workspace: give the output back and drop the multi-GB work tree.
          # A failed build can leave bind mounts (/dev, /proc) under work/: unmount them first and never let
          # rm cross a filesystem boundary.
          docker exec -i ci-os-build bash -s <<'EOF' || true
          awk '$2 ~ /^\/work\/work(\/|$)/ { print $2 }' /proc/mounts | sort -r | xargs -r umount -l
          rm -rf --one-file-system /work/work
          EOF
          docker exec ci-os-build chown -R "$(id -u):$(id -g)" /work/output || true
          docker rm -f ci-os-build || true

      - name: Generate checksums
        id: checksums
        run: |
          cd output

          ISO_NAME=$(ls companion-os-*.iso)
          echo "iso_name=$ISO_NAME" >> $GITHUB_OUTPUT

          # Generate SHA256 and MD5 checksums
          sha256sum "$ISO_NAME" > SHA256SUMS
          md5sum "$ISO_NAME" > MD5SUMS

          echo "Checksums generated:"
          cat SHA256SUMS
          cat MD5SUMS

      - name: Sign checksums (if enabled)
        if: github.event.inputs.sign == 'true' && env.GPG_KEY_PRESENT == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd output

          # Import GPG key
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

          # Sign checksums
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
            --armor --detach-sign --output SHA256SUMS.gpg SHA256SUMS

          echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
            --armor --detach-sign --output MD5SUMS.gpg MD5SUMS

          echo "Checksums signed successfully"

      - name: Generate SBOM
        run: |
          echo "Generating Software Bill of Materials..."

          # Create a simple SBOM listing packages in the ISO
          cat > output/SBOM.txt << EOF
          Companion OS Software Bill of Materials
          =======================================

          Base: Ubuntu 26.04.1 LTS (Resolute Raccoon)
          Companion OS Version: ${{ steps.version.outputs.version }}
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          Custom Packages:
          - ci-os-branding

          For the complete package list, see the *.manifest files in the ISO's casper/ directory.
          EOF

          echo "SBOM generated"

      - name: Create release notes
        id: release_notes
        run: |
          cat > release-notes.md << EOF
          # Companion OS ${{ steps.version.outputs.version }} - Ubuntu 26.04 Based

          ## What's New

          - 🚀 **Based on Ubuntu 26.04.1 LTS (Resolute Raccoon)** - Long-term support release
          - 🎨 **Custom Branding** - Companion OS identity and the Companion Intelligence brand look
          - 🔒 **Privacy First** - No ads, no surveillance, telemetry disabled
          - 💻 **AMD GPU Ready** - ROCm from the Ubuntu 26.04 archive on Strix Halo, with the kernel's inbox amdgpu driver
          - 🛠️ **Developer Friendly** - Compatible with Docker, VS Code, Node.js
          - 🌐 **Sovereign Computing** - Your data, your control

          ## Installation

          1. Download the ISO file below
          2. Create a bootable USB drive using:
             - **Linux**: \`sudo dd if=companion-os-*.iso of=/dev/sdX bs=4M\`
             - **Windows**: Use Rufus or Etcher
             - **macOS**: Use Etcher or \`dd\` command
          3. Boot from the USB drive
          4. Follow the installer
          5. Run \`ci-os-info\` after installation to see system information

          ## AMD GPU Support

          On a Strix Halo-class machine (Ryzen AI Max, gfx1151) the helper installs the ROCm
          packages from the Ubuntu 26.04 archive and uses the kernel's inbox amdgpu driver; on
          other hardware it installs nothing:
          \`\`\`bash
          sudo ci-os-install-rocm
          \`\`\`

          ## Verification

          Verify the ISO checksum:
          \`\`\`bash
          sha256sum -c SHA256SUMS
          \`\`\`

          ## System Requirements

          - **CPU**: 64-bit x86 processor (AMD Ryzen recommended)
          - **RAM**: 4GB minimum, 8GB+ recommended
          - **Storage**: 25GB minimum, 50GB+ recommended
          - **GPU**: AMD Radeon RX 5000 series or newer for AI features

          ## What's Removed

          - Ubuntu telemetry services (ubuntu-report, popularity-contest, apport)
          - Snap Store (use GNOME Software for native packages)
          - Default games and bloatware
          - Metric collection endpoints blocked in /etc/hosts

          ## Built-in Commands

          - \`ci-os-info\` - Display system and GPU information
          - \`ci-os-install-rocm\` - Install AMD ROCm stack for AI

          ---

          **Built**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Base**: Ubuntu 26.04.1 LTS (Resolute Raccoon)
          **Source**: https://github.com/companionintelligence/CI-OS

          © Companion Intelligence — Lifescope Inc
          EOF

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-os-iso-${{ steps.version.outputs.version }}
          path: |
            output/companion-os-*.iso
            output/SHA256SUMS
            output/MD5SUMS
            output/SHA256SUMS.gpg
            output/MD5SUMS.gpg
            output/SBOM.txt
          retention-days: 7
          compression-level: 0  # ISO is already compressed

      - name: Create GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: Companion OS ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            output/companion-os-*.iso
            output/SHA256SUMS
            output/MD5SUMS
            output/SHA256SUMS.gpg
            output/MD5SUMS.gpg
            output/SBOM.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ CI-OS ISO built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**ISO Name**: ${{ steps.checksums.outputs.iso_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Base**: Ubuntu 26.04.1 LTS (Resolute Raccoon)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checksums" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat output/SHA256SUMS >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
