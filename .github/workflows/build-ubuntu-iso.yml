      - name: Extract base ISO
        run: |
          mkdir -p iso squashfs
          sudo mount -o loop ubuntu-base.iso /mnt
          sudo rsync -a /mnt/ iso/
          sudo umount /mnt
          sudo chmod -R u+w iso/
          
      - name: Extract squashfs
        run: |
          sudo unsquashfs -d squashfs iso/casper/filesystem.squashfs
          
      - name: Prepare chroot environment
        run: |
          sudo mount --bind /dev squashfs/dev
          sudo mount --bind /run squashfs/run
          sudo mount -t proc none squashfs/proc
          sudo mount -t sysfs none squashfs/sys
          sudo mount -t devpts none squashfs/dev/pts
          sudo cp /etc/resolv.conf squashfs/etc/resolv.conf
          
      - name: Copy CI OS files into chroot
        run: |
          sudo mkdir -p squashfs/root/CI-OS
          sudo cp -r assets configs docs scripts setup squashfs/root/CI-OS/
          
      - name: Apply CI OS branding in chroot
        run: |
          sudo chroot squashfs /bin/bash -c '
            set -euo pipefail
            
            # Update package lists
            apt-get update
            
            # Apply CI OS branding
            cd /root/CI-OS/setup/os-changes
            chmod +x *.sh
            ./complete-rebranding.sh --skip-reboot-check
            
            # Optional: Install additional packages
            # apt-get install -y gnome-remote-desktop docker.io
            
            # Clean up
            apt-get clean
            apt-get autoremove -y
            rm -rf /var/lib/apt/lists/*
            rm -rf /tmp/*
            rm -rf /root/.cache
            
            # Keep CI OS files for reference (remove .git to save space)
            rm -rf /root/CI-OS/.git
            
            # Update initramfs
            update-initramfs -u -k all
          '
          
      - name: Validate branding in chroot
        run: |
          echo "Validating CI OS branding..."
          sudo chroot squashfs /bin/bash -c '
            set -euo pipefail
            cd /root/CI-OS/setup/os-changes
            ./validate-ci-theme.sh || echo "Validation warnings (may be expected in chroot)"
          '
          
      - name: Clean up chroot
        if: always()
        run: |
          sudo umount squashfs/dev/pts || true
          sudo umount squashfs/sys || true
          sudo umount squashfs/proc || true
          sudo umount squashfs/run || true
          sudo umount squashfs/dev || true
          
      - name: Repack squashfs
        run: |
          sudo rm iso/casper/filesystem.squashfs
          sudo mksquashfs squashfs iso/casper/filesystem.squashfs \
            -comp xz -b 1M -Xdict-size 100% -Xbcj x86
            
      - name: Update filesystem metadata
