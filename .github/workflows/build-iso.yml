name: Build and Publish CI-OS ISOs

on:
  workflow_dispatch:
  schedule:
    # Build ISOs weekly on Sundays at 2 AM UTC
    - cron: "0 2 * * 0"
  push:
    branches: [ main ]
    paths:
      - 'Containerfile*'
      - 'files/**'
      - '.github/workflows/build-iso.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image_variant:
          - regular
          - nvidia
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names and tags
        id: meta
        run: |
          if [ "${{ matrix.image_variant }}" == "regular" ]; then
            echo "image_name=ci-os" >> $GITHUB_OUTPUT
            echo "containerfile=Containerfile" >> $GITHUB_OUTPUT
            echo "base_image=bazzite" >> $GITHUB_OUTPUT
          else
            echo "image_name=ci-os-nvidia" >> $GITHUB_OUTPUT
            echo "containerfile=Containerfile.nvidia" >> $GITHUB_OUTPUT
            echo "base_image=bazzite-nvidia" >> $GITHUB_OUTPUT
          fi
          echo "image_tag=v01-$(date +%Y%m%d)" >> $GITHUB_OUTPUT
          echo "image_tag_latest=v01-latest" >> $GITHUB_OUTPUT

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.meta.outputs.containerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag_latest }}
          labels: |
            org.opencontainers.image.title=CI-OS ${{ matrix.image_variant }}
            org.opencontainers.image.description=Bazzite-based ISO with Wine, Proton, and WinApps support
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign container image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}

  build-isos:
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image_variant:
          - regular
          - nvidia
        fedora_version: [41]
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image names and tags
        id: meta
        run: |
          if [ "${{ matrix.image_variant }}" == "regular" ]; then
            echo "image_name=ci-os" >> $GITHUB_OUTPUT
          else
            echo "image_name=ci-os-nvidia" >> $GITHUB_OUTPUT
          fi
          echo "image_tag=v01-latest" >> $GITHUB_OUTPUT
          echo "iso_name=CI-OS-v01-${{ matrix.image_variant }}-${{ matrix.fedora_version }}.iso" >> $GITHUB_OUTPUT

      - name: Build ISO
        uses: jasonn3/build-container-installer@main
        id: build_iso
        with:
          arch: x86_64
          image_name: ${{ steps.meta.outputs.image_name }}
          image_repo: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          image_tag: ${{ steps.meta.outputs.image_tag }}
          version: ${{ matrix.fedora_version }}
          variant: Kinoite
          iso_name: ${{ steps.meta.outputs.iso_name }}
          secure_boot_key_url: ''
          enrollment_password: 'ci-os'
          enable_cache_dnf: "false"
          enable_cache_skopeo: "false"

      - name: Move ISOs to upload directory
        id: upload_setup
        run: |
          ISO_UPLOAD_DIR=${{ github.workspace }}/upload
          mkdir -p ${ISO_UPLOAD_DIR}
          mv ${{ steps.build_iso.outputs.iso_path }}/${{ steps.build_iso.outputs.iso_name }} ${ISO_UPLOAD_DIR}/
          mv ${{ steps.build_iso.outputs.iso_path }}/${{ steps.build_iso.outputs.iso_name }}-CHECKSUM ${ISO_UPLOAD_DIR}/
          echo "iso_upload_dir=${ISO_UPLOAD_DIR}" >> $GITHUB_OUTPUT

      - name: Generate release info
        id: release_info
        run: |
          echo "release_name=CI-OS v01 $(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "release_tag=v01-$(date +%Y%m%d)" >> $GITHUB_OUTPUT
          cat > release_notes.md << 'EOF'
          # CI-OS v01 - Bazzite with Windows Apps Support
          
          ## What's New
          - 🎮 Based on Bazzite ${{ matrix.fedora_version }} for the ultimate gaming experience
          - 🍷 Wine pre-configured for running Windows applications
          - ⚙️ Proton tools and protontricks included
          - 💻 WinApps support for seamless Windows VM integration
          - 🚀 Easy setup with just commands (`ujust setup-ci-os`)
          
          ## Variants
          - **Regular**: Standard Bazzite base with Windows apps support
          - **NVIDIA**: Includes NVIDIA drivers and GPU acceleration optimizations
          
          ## Installation
          1. Download the appropriate ISO for your system
          2. Create a bootable USB drive
          3. Boot and install like any Linux distribution
          4. Run `ujust setup-ci-os` for first-time configuration
          
          ## Verification
          All ISOs are signed and include checksums for verification.
          
          Built on: $(date)
          Based on: Bazzite Fedora ${{ matrix.fedora_version }}
          EOF

      - name: Create/Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_info.outputs.release_tag }}
          name: ${{ steps.release_info.outputs.release_name }}
          body_path: release_notes.md
          files: |
            ${{ steps.upload_setup.outputs.iso_upload_dir }}/*.iso
            ${{ steps.upload_setup.outputs.iso_upload_dir }}/*-CHECKSUM
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts for testing
        uses: actions/upload-artifact@v4
        if: github.ref_name != 'main'
        with:
          name: ${{ steps.meta.outputs.iso_name }}
          path: ${{ steps.upload_setup.outputs.iso_upload_dir }}
          retention-days: 7
          compression-level: 0