name: PR checks

# Cheap, always-on gate (~30s, no secrets): syntax + shellcheck errors + py_compile + yamllint
# + no committed build artifacts. The heavier workflows stay manual (ci-local:gated); this one
# is deliberately not gated so every PR gets a signal. Same script runs locally:
#   ./core/lib/check-repo.sh
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-repo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck yamllint
      - run: ./core/lib/check-repo.sh

  # Companion Stick CLI (stick/). Rust is first-class inside stick/ only.
  stick:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: stick
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stick
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: MSRV (rust-version in stick/Cargo.toml)
        run: |
          rustup toolchain install 1.75 --profile minimal
          cargo +1.75 check --locked --all-targets
