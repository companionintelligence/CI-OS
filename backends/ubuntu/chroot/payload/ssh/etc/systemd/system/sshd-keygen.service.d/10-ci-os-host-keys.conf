# Companion OS: make the SSH host keys of every machine that is installed from this image, whatever the machine-id says.
#
# customize-chroot.sh removes the host keys openssh-server generated while the image was built (they would be the same on
# every install). Debian's sshd-keygen.service then has to make a fresh set, but it is gated on ConditionFirstBoot=yes, and
# on a machine installed from the live USB that condition is false: subiquity copies the live session's /etc/machine-id
# into the new system (the ubuntu-desktop-bootstrap snap, revision 665 on 26.04.1: subiquity/models/subiquity.py, _machine_id and
# the write_files entry "etc_machine_id"), and systemd calls a boot the first one only when /etc/machine-id is missing, empty or
# "uninitialized" (machine-id(5), "First boot semantics"). Measured with systemd 259.5 as PID 1 (tests/first-boot-units-boot.sh): with
# an installer-style machine-id the unit is skipped ("ConditionFirstBoot=yes was not met"), no key is made, and ssh.service dies in
# ExecStartPre=/usr/sbin/sshd -t with "no hostkeys available". (On the installer's own path cloud-init's ssh module also makes
# keys, so a normal install was probably saved by it; this drop-in does not depend on that.)
#
# So the unit is gated on what it is for: there is no ed25519 host key. `ssh-keygen -A` then makes whichever of the
# rsa, ecdsa and ed25519 keys are missing and leaves existing ones alone, so a machine that has its keys never gets new ones.
# The unit still runs Before=ssh.service and sshd@.service and is still pulled in by ssh.socket, ssh.service and sshd.service
# (the packaged [Install] section), and cloud-init-network.service still runs before it.
#
# An empty assignment resets the whole list of Condition*= lines (systemd.unit(5)), so the two conditions the package
# sets besides ConditionFirstBoot are written out again. Keep them equal to /usr/lib/systemd/system/sshd-keygen.service.
[Unit]
ConditionFirstBoot=
ConditionPathIsReadWrite=/etc/ssh
ConditionPathIsSymbolicLink=!/etc/ssh
ConditionPathExists=!/etc/ssh/ssh_host_ed25519_key
