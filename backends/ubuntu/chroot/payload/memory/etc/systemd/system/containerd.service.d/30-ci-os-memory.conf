# Companion OS memory protection: containerd.service, the container runtime under the engine. [I]
#
# Why: the engine cannot start, stop or report on a container without this daemon, so it is protected the same way as the engine's own
# (docker.service.d/30-ci-os-memory.conf). MemoryLow is a soft floor: it is given back before the kernel kills anything.
#
# Limit: the containers themselves are not inside this unit; see the note in the engine's file.
# Status: a proposal, [I] implemented and not proven (see system.slice.d/30-ci-os-memory.conf).
# Off-switch: delete this file (on the CachyOS edition also its line in usr/share/ci-os/installed/carry-over.list).
[Service]
MemoryLow=3%
