# Companion OS memory protection: docker.service, the container engine's daemon. [I]
#
# Why: the engine has to keep answering while the machine is short of memory, or the Hub it runs cannot be stopped, restarted or looked
# at. MemoryLow is a soft floor: it is given back before the kernel kills anything, so it cannot make a bad situation worse.
#
# Limit: the containers are not inside this unit. With the systemd cgroup driver they are docker-<id>.scope units in system.slice, so
# this file protects the daemon and not the Hub's containers (a separate slice for them is an owner question). Which cgroup driver the
# images use: UNKNOWN until a VM run prints it (backends/ubuntu/iso/tests/lib/installed-boot-probe.sh).
# Status: a proposal, [I] implemented and not proven (see system.slice.d/30-ci-os-memory.conf).
# Off-switch: delete this file (on the CachyOS edition also its line in usr/share/ci-os/installed/carry-over.list).
[Service]
MemoryLow=3%
