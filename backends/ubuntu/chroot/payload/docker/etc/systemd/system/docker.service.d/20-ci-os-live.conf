[Unit]
# No-op on an installed system (the storage unit's ConditionPathExists skips it, and a skipped unit satisfies
# Requires=). In a live session it puts /var/lib/docker and /var/lib/containerd on a filesystem overlayfs can
# use before the daemons start. Requires=, not Wants=: if the storage unit fails, Docker must not start on the
# live overlayfs, where it appears to work and then fails on the first pull or run.
Requires=ci-os-live-container-storage.service
After=ci-os-live-container-storage.service
