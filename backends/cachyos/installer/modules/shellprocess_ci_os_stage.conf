#
# shellprocess instance ci_os_stage: stage the Companion OS parts into the target. Runs in the LIVE system (dontChroot) with the
# target mounted at ${ROOT}, right after packages@online -- the installed packages must exist (nginx, docker, grub, plymouth,
# cachyos-kde-settings), and plymouthcfg / initcpio / grubcfg / bootloader / services-systemd come later and need the result.
# What the script does, and its failure policy (payload: fail closed; identity and brand: fail open), is in its header:
# installer/scripts/ci-os-stage-target.sh (installed at /usr/share/ci-os/calamares/scripts/).
# A non-zero exit aborts the installation with the script's output in the error page and in Calamares' log.
---
dontChroot: true
timeout: 1800
i18n:
  name: "Installing Companion OS components"
script:
  - command: "bash /usr/share/ci-os/calamares/scripts/ci-os-stage-target.sh ${ROOT}"
    timeout: 1800
    verbose: true
