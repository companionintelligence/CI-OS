#
# Configuration for the users module. Derived from the pinned installer's modules/users.conf. Differences:
#   defaultGroups   + docker. `must_exist: false, system: true` makes the users job create the group (a system group, via
#                   groupadd --system) when the target lacks it, so the first user is a docker member from the first login. This
#                   runs before packages@online installs docker; the package's sysusers.d snippet then finds the group present.
#                   backends/arch/provision/provision.sh add_user_to_docker_group() repeats the membership at first boot.
#   hostname        template "companion-os" instead of "cachyos-${cpu}". The user can still edit it on the users page. The mDNS
#                   name (avahi) follows the hostname, so two Companion OS machines on one network get companion-os and
#                   companion-os-2.
# Everything else is the installer's own setting, kept so behaviour stays what CachyOS tested.
---
defaultGroups:
    - wheel
    - rfkill
    - sys
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true
    - audio
    - name: docker
      must_exist: false
      system: true
    - name: nopasswdlogin
      must_exist: false
      system: true

doAutologin:     false

sudoersGroup:    wheel

setRootPassword: true
doReusePassword: true

passwordRequirements:
    minLength: 4
allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
  shell: /bin/bash
  forbidden_names:
    - root
    - adm
    - bin
    - daemon
    - dbus
    - ftp
    - games
    - halt
    - http
    - lp
    - mail
    - man
    - news
    - nobody
    - ntp
    - operator
    - polkitd
    - postfix
    - rtkit
    - shutdown
    - sync
    - sys
    - systemd-coredump
    - systemd-network
    - systemd-resolve
    - systemd-timesync
    - uucp
    - uuidd
  home_permissions: "o700"
  nopasswd_group: "nopasswdlogin"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "companion-os"
  forbidden_names: [ localhost ]

allowActiveDirectory: false

platform:
    desktop:
        presets:
            fullName:
                editable: true
            loginName:
                editable: true
    handheld:
        presets:
            fullName:
                value: "Deck"
                editable: true
            loginName:
                value: "deck"
                editable: true
