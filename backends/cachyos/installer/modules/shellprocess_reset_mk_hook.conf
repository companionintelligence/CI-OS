# SPDX-License-Identifier: CC0-1.0
#
# shellprocess instance reset_mk_hook (job 41 of 47): take the installer's mkinitcpio hook out of the target again once the initramfs is
# built. Derived from the pinned installer's modules/shellprocess_reset_mk_hook.conf (3.4.2-13): the commands, dontChroot and the i18n
# text are the installer's.
#
# The one change: an explicit `timeout: 600`. The installer's file sets none, so its commands ran on Calamares' silent default of 30 s.
# See shellprocess_modify_mk_hook.conf, shellprocess_initialize_pacman.conf and lib/ci-shellprocess.py.
---
dontChroot: false
timeout: 600
script:
 - "rm /etc/pacman.d/hooks/90-mkinitcpio-install.hook"
 - "rm /usr/share/libalpm/scripts/mkinitcpio-install-calamares"
i18n:
 name: "reset 90-mkinitcpio-install.hook"
