# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# shellprocess instance ci_os_fixups: in the TARGET (chroot), after the stock final shellprocess. Fix-ups of CachyOS hard-codes
# that no configuration reaches (list in installer/scripts/ci-os-post-install-fixups.sh). ${USER} is the account the users job
# created. The script never fails the installation: it logs WARN lines, which end up in Calamares' log.
# The script was copied into the target by ci_os_stage.
---
dontChroot: false
timeout: 900
i18n:
  name: "Finishing the Companion OS installation"
script:
  - command: "bash /usr/lib/ci-os/ci-os-post-install-fixups.sh ${USER}"
    timeout: 900
    verbose: true
