#
# shellprocess instance initialize_pacman (job 13 of 47, "initialize pacman ... ranking mirrors ..."): rank the mirrors, create the live
# system's pacman keyring and copy mirrorlists and keyring to the target. Derived from the pinned installer's
# modules/shellprocess_initialize_pacman.conf (3.4.2-13); the commands, their order, dontChroot and the i18n texts are the installer's.
#
# The one change: an explicit timeout on every command. The installer's file gives only the first command (update-mirrorlist) a
# timeout; the second, create-pacman-keyring, got Calamares' default of 30 s. That script runs pacman-key --init, two pacman -Sy of the
# keyring packages (up to five tries each) and pacman-key --populate (a gpg import of the Arch and CachyOS keys). Under QEMU/TCG the
# populate step alone took about 28 s, so ISO #5 failed twice at 2 percent with "failed to finish in 30 seconds" and passed the third
# time with 2 s to spare; a slow Wi-Fi link, an old disk or a loaded machine gets there without an emulator, and the result is a dead
# install before the first package. Observed on the run that passed: 68 s for the whole job (rate-mirrors 40 s, keyring 28 s).
#
# 3600 s for the two commands that talk to mirrors (a 10-year-old laptop on slow Wi-Fi retries a database download for minutes);
# 600 s for the rest of the file (mkdir and cp of a few files and the keyring directory, on the freshly formatted target). Nothing here
# may fall back to the 30 s default, and 0 means "no limit" to Calamares: installer-config.py, calamares-online.sh (the `shell-timeouts`
# guard) and verify-iso.sh fail on either. lib/ci-shellprocess.py explains the rules; the `shell-timeouts` guard also fails when the
# installer's version of this file gains a command this copy does not run (a frozen copy must be reviewed, not silently outdated).
---
dontChroot: true
timeout: 600
script:
 - command: "bash /etc/calamares/scripts/update-mirrorlist"
   timeout: 3600
   verbose: true
 - command: "bash /etc/calamares/scripts/create-pacman-keyring"
   timeout: 3600
   verbose: true
 - "mkdir -p ${ROOT}/etc/pacman.d/"
 - "cp /etc/pacman.d/mirrorlist ${ROOT}/etc/pacman.d/"
 - "cp /etc/pacman.d/cachyos-mirrorlist ${ROOT}/etc/pacman.d/"
 - "cp /etc/pacman.d/cachyos-v3-mirrorlist ${ROOT}/etc/pacman.d/"
 - "cp /etc/pacman.d/cachyos-v4-mirrorlist ${ROOT}/etc/pacman.d/"
 - "cp -a /etc/pacman.d/gnupg ${ROOT}/etc/pacman.d/"
 - "cp /etc/resolv.conf ${ROOT}/etc/"
i18n:
 name: "initialize pacman ... ranking mirrors ... copy pacman mirrorlist and keyring to target ..."
 name[de]: "Pacman initialisieren ... Mirrors ordnen ... Pacman-mirrorlist und Schlüsselbund kopieren ..."
 name[fi]: "alusta pacman ,,, järjestä peilipalvelimet ... kopioi pacman:n peililista ja avaimet kohteeseen ..."
 name[fr]: "initialiser pacman ... classement des miroirs ... copier la liste des miroirs pacman et le trousseau de clés vers la cible ..."
 name[it]: "inizializza pacman ... classifica i mirror ... copia la lista dei mirror di pacman e il portachiavi sul target ..."
 name[es]: "inicializar pacman ... ranking mirrors ... copiar pacman mirrorlist y llavero al objetivo ..."
 name[ru]: "инициализировать pacman ... ранжировать зеркала ... скопировать список зеркал pacman и связку ключей в цель ..."
 name[zh_CN]: "初始化 pacman ... 排名镜像 ... 将 pacman 镜像列表和密钥环复制到目标 ..."
 name[ja]: "pacmanを初期化します...ミラーをランク付けします... pacmanミラーリストとキーリングをターゲットにコピーします..."
 name[sv]: "initiera pacman ... rangordna speglar ... kopiera pacmans spegellista och nyckelring till mål ..."
 name[pt_BR]: "Iniciar pacman... Classificar espelhos... Copiar lista de espelhos do pacman e chaveiro do alvo..."
