# SPDX-License-Identifier: CC0-1.0
#
# shellprocess instance modify_mk_hook (job 12 of 47): put the installer's own mkinitcpio hook in place on the live host and in the
# target, so that pacstrap does not build an initramfs for every kernel it installs. Derived from the pinned installer's
# modules/shellprocess_modify_mk_hook.conf (3.4.2-13): the commands, their order, dontChroot and the i18n text are the installer's.
#
# The one change: an explicit `timeout: 600`. The installer's file sets none, so its commands ran on Calamares' silent default of 30 s
# (mkdir and cp of two small files and a chmod: seconds, but on a slow or busy disk a write can stall, and one slow job at 2 percent
# kills the whole install, as the 30 s keyring limit did on ISO #5). See shellprocess_initialize_pacman.conf and lib/ci-shellprocess.py.
---
dontChroot: true
timeout: 600
script:
 - "mkdir -p /etc/pacman.d/hooks/"
 - "cp /etc/calamares/scripts/90-mkinitcpio-install.hook /etc/pacman.d/hooks/"
 - "mkdir -p ${ROOT}/usr/share/libalpm/scripts/"
 - "cp /etc/calamares/scripts/mkinitcpio-install-calamares ${ROOT}/usr/share/libalpm/scripts/"
 - "chmod +x ${ROOT}/usr/share/libalpm/scripts/mkinitcpio-install-calamares"
 - "mkdir -p ${ROOT}/etc/pacman.d/hooks/"
 - "cp /etc/calamares/scripts/90-mkinitcpio-install.hook ${ROOT}/etc/pacman.d/hooks/"
i18n:
 name: "modify 90-mkinitcpio-install.hook on host and chroot"
