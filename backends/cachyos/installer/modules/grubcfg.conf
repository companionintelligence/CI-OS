#
# Configuration for the grubcfg module (writes /etc/default/grub of the target). Derived from the pinned installer's
# modules/grubcfg.conf; the theme path and the two menu switches below are the changes. GRUB_THEME points at the Companion OS theme that
# scripts/ci-os-stage-target.sh carries into the target before this job runs (contract.env CI_INSTALLED_GRUB_THEME). The
# GRUB_DISTRIBUTOR (menu entry titles) is the branding's bootloaderEntryName, "Companion OS" (keep_distributor: false).
#
# The boot menu of an appliance lists Companion OS and the firmware's "UEFI Firmware Settings" entry, nothing else. On ISO #5's installed
# system it also listed what grub-mkconfig found in the machine it was installed from: "UiApp", a "QEMU DVD-ROM" for a drive that is no
# longer attached, the NVMe disk, "EFI Internal Shell" and a second "companion-os", each ending in "(EFI BootNext)". Those are not from
# os-prober: the grub package carries /etc/grub.d/31_efi_bootnext, which turns every entry of `efibootmgr -v` into a menu entry, and its
# own switch is GRUB_DISABLE_BOOTNEXT (its header says it is "intentionally independent of GRUB_DISABLE_OS_PROBER"). So both are set:
#   GRUB_DISABLE_BOOTNEXT: true      no entry per firmware boot variable (a stale, per-machine list that is wrong on the next machine)
#   GRUB_DISABLE_OS_PROBER: true     no scan of the other disks (30_os-prober mounts every partition it finds and adds a chainloader entry
#                                    for each other system), which also makes the install's grub-mkconfig faster and touches no other disk.
#                                    The cost, on purpose: a Windows or other Linux next to Companion OS gets no GRUB entry; it stays
#                                    reachable from the firmware's boot menu and from "UEFI Firmware Settings", and one line brings the
#                                    scan back (GRUB_DISABLE_OS_PROBER=false in /etc/default/grub, then grub-mkconfig -o /boot/grub/grub.cfg).
# `always_use_defaults` makes the grubcfg job write these keys; the booleans are written as 'true' (quoted), which both scripts compare with.
# bootloader runs grub-mkconfig AFTER grubcfg, so the switches are in force when grub.cfg is generated (the fix-ups only check).
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params:
  - "nowatchdog"
  - "nvme_load=YES"
defaults:
    GRUB_TIMEOUT: 5
    GRUB_TOP_LEVEL: "/boot/vmlinuz-linux-cachyos"
    GRUB_DISABLE_SUBMENU: false
    GRUB_DISABLE_OS_PROBER: true
    GRUB_DISABLE_BOOTNEXT: true
    GRUB_DISABLE_RECOVERY: true
    GRUB_THEME: "/usr/share/grub/themes/companion-os/theme.txt"
    GRUB_EARLY_INITRD_LINUX_STOCK: ""
always_use_defaults: true
