#
# Configuration for the grubcfg module (writes /etc/default/grub of the target). Derived from the pinned installer's
# modules/grubcfg.conf; the theme path is the only change. GRUB_THEME points at the Companion OS theme that
# scripts/ci-os-stage-target.sh carries into the target before this job runs (contract.env CI_INSTALLED_GRUB_THEME). The
# GRUB_DISTRIBUTOR (menu entry titles) is the branding's bootloaderEntryName, "Companion OS" (keep_distributor: false).
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params:
  - "nowatchdog"
  - "nvme_load=YES"
defaults:
    GRUB_TIMEOUT: 5
    GRUB_TOP_LEVEL: "/boot/vmlinuz-linux-cachyos"
    GRUB_DISABLE_SUBMENU: false
    GRUB_DISABLE_OS_PROBER: false
    GRUB_DISABLE_RECOVERY: true
    GRUB_THEME: "/usr/share/grub/themes/companion-os/theme.txt"
    GRUB_EARLY_INITRD_LINUX_STOCK: ""
always_use_defaults: true
