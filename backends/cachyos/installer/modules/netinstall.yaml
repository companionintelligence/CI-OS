# Package groups of the Companion OS installer's "Additional packages" page.
#
# The only source Calamares reads (modules/netinstall.conf lists no remote URL). CachyOS' own installer fetches its list from
# raw.githubusercontent.com on a moving branch first; this edition does not (decision D6): what gets installed is what this
# file says, reviewed in git. The group format is Calamares' netinstall module's (hidden, selected, critical, platform,
# packages, subgroups); the trimmed groups below are the CachyOS groups of the pinned installer (cachyos-calamares-next
# 3.4.2-13, modules/netinstall.yaml) minus what Companion OS leaves out on purpose:
#   - ufw / ufw-extras and plasma-firewall: no host firewall, see backends/cachyos/installer/README.md ("Firewall").
#   - cachyos-hello, cachyos-wallpapers, cachyos-kernel-manager, cachyos-packageinstaller, the CachyOS KDE theme packages and
#     the fish/zsh shell configs: CachyOS-branded applications and artwork. The kernels, cachyos-settings and
#     cachyos-kde-settings (the Plasma defaults) stay: they are the base this edition is built on.
#   - every desktop other than Plasma, handheld groups, kdeconnect (a network listener without a firewall).
# Companion OS' own packages (Docker, the setup-portal stack, tailscale ...) are NOT here: they are `operations` in
# modules/packages_online.conf, so they install whatever the user ticks on this page.
#
# Every name was checked against archlinux.org and the CachyOS repository database; the result is recorded in
# iso/tests/installer-fixtures/packages.json and re-checked offline by iso/tests/installer-config.sh.
# `$LOCALE` in a name is Calamares' own placeholder (the language chosen on the locale page).

- name: "Base system (hidden)"
  description: "CachyOS repository plumbing: hooks, keyrings, mirror lists and hardware detection"
  hidden: true
  selected: true
  critical: true
  packages:
    - cachyos-hooks
    - cachyos-keyring
    - cachyos-mirrorlist
    - cachyos-v3-mirrorlist
    - cachyos-v4-mirrorlist
    - cachyos-rate-mirrors
    - chwd

- name: "Kernels (hidden)"
  description: "The kernels of the CachyOS base (also installed by the pacstrap step; --needed makes this a no-op)"
  hidden: true
  selected: true
  critical: true
  platform: "desktop"
  packages:
    - linux-cachyos
    - linux-cachyos-headers
    - linux-cachyos-lts
    - linux-cachyos-lts-headers

