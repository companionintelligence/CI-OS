#
# Configuration for the bootloader module. Derived from the pinned installer's modules/bootloader.conf. GRUB only:
# Limine, rEFInd and systemd-boot are not offered (modules/packagechooser_bootloader.conf has one item), because the Companion
# OS boot menu and the installed-system theme are GRUB's (decision D6) and bootloader/main.py hard-codes the CachyOS name into
# Limine's menu (main.py `/+CachyOS`, no config reaches it).
#
# efiBootLoaderVar makes the module read the choice the chooser stored in global storage (key packagechooser_bootloader);
# pacstrap/main.py reads the same key and installs grub, grub-hook, os-prober (and cachyos-grub-theme, which
# scripts/ci-os-post-install-fixups.sh removes again). efiBootLoader is only used when that key is missing.
---
efiBootLoaderVar: "packagechooser_bootloader"
efiBootLoader: "grub"

kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"

# Entries of systemd-boot / rEFInd / Limine; unused with GRUB, kept so the file keeps the keys the module reads.
loaderEntries:
  - "timeout 5"
  - "console-mode keep"
kernelParams: [ "quiet","nowatchdog" ]
refindKernelList: [ "linux-cachyos-bore","linux-cachyos-lts","linux-cachyos-bmq","linux-cachyos","linux" ]

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# The name of the firmware boot entry (the UEFI boot menu shows it) and of the directory on the EFI system partition.
efiBootloaderId: "companion-os"
installEFIFallback: true
installHybridGRUB: false

# Limine only; no Limine here.
limineSplashLogo: ""
