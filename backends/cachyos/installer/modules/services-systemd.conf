#
# Configuration for the services-systemd module (`systemctl enable` in the target). The installer's own list, plus the
# Companion OS units (Arch packages never enable what they install). `mandatory: false` everywhere, as the installer does: a unit
# that does not exist (an optional package that was not ticked) is skipped, it does not abort the install.
#
# Added:
#   docker                 the engine. backends/arch/provision/provision.sh install_docker() returns early when docker is
#                          installed, without enabling it, so this is the only place that does.
#   setup-backend, setup-network-monitor
#                          the part of the captive-portal stack (core/headless/payload) that runs at every boot. setup-backend is
#                          gunicorn on 127.0.0.1:5000, loopback only, and does nothing until a request reaches it; nothing else
#                          starts it. setup-network-monitor is the watcher that decides whether the portal is needed. The units
#                          come from the payload that scripts/ci-os-stage-target.sh copies into /etc/systemd/system before this
#                          job runs.
#   ci-os-first-boot-setup service + timer   provision.sh --tier=core on the first boot with a network (backends/cachyos/provision).
#
# NOT enabled, on purpose, and started on demand instead: nginx, hostapd-setup, dnsmasq-setup. Evidence (the test
# iso/tests/installer-stage.sh, "--print-units", re-derives it from the payload on every run):
#   - setup-network-monitor.sh runs /usr/local/bin/setup-device-hotspot-start.sh when there has been no default route for two
#     checks after the 45 s boot grace;
#   - that script runs `systemctl start nginx.service`, `systemctl start hostapd-setup.service` and `systemctl start
#     dnsmasq-setup.service` itself, after it has written the hostapd and dnsmasq configs for the interface it detected (the
#     first one whose `iw` modes include AP; none -> exit 3 and nothing is changed). A unit that is started by name needs no
#     `enable`. The same script's `stop` mode, which setup_service.py calls when it joins the user's network, undoes the episode
#     (units stopped, the AP address removed, the interface handed back to NetworkManager, nginx stopped if the script started
#     it), and it does the same by itself when a start fails or is interrupted. It no longer pauses Traefik;
#   - enabling them as well would run an access point at EVERY boot, with the payload's static config pinned to one vendor board's
#     interface (`wlp192s0`: hostapd fails and restarts every 5 s on any other machine) and the committed WPA2 passphrase, and it
#     would open port 80, with the setup API behind it, on every network the desktop joins (see "Known issue in the shared setup
#     payload" in installer/README.md). The portal stack is for a machine that has no network; a desktop that has one does not run it.
# NOT added: tailscaled and ollama. provision.sh enables them after it has configured them (Ollama's GPU and context drop-ins).
# Removed from the installer's own list: arch-update.timer (user unit). It belongs to cachy-update, which this edition does not install
# (see netinstall.yaml); enabling the timer of an absent package only writes a "Unit does not exist" line into the installation log.
---
units:
   - name: "NetworkManager"
     action: "enable"
     mandatory: false
   - name: "cups"
     action: "enable"
     mandatory: false
   - name: "avahi-daemon"
     action: "enable"
     mandatory: false
   - name: "systemd-timesyncd"
     action: "enable"
     mandatory: false
   - name: "vboxservice"
     action: "enable"
     mandatory: false
   - name: "vmtoolsd"
     action: "enable"
     mandatory: false
   - name: "vmware-vmblock-fuse"
     action: "enable"
     mandatory: false
   - name: "firewalld"
     action: "enable"
     mandatory: false
   - name: "zfs-import-cache"
     action: "enable"
     mandatory: false
   - name: "zfs-mount"
     action: "enable"
     mandatory: false
   - name: "zfs-import.target"
     action: "enable"
     mandatory: false
   - name: "zfs.target"
     action: "enable"
     mandatory: false
   - name: "fstrim.timer"
     action: "enable"
     mandatory: false
   - name: "pacman-init"
     action: "disable"
     mandatory: false
   - name: "multi-user.target"
     action: "disable"
     mandatory: false
   - name: "bluetooth"
     action: "enable"
     mandatory: false
   - name: "docker"
     action: "enable"
     mandatory: false
   - name: "setup-backend"
     action: "enable"
     mandatory: false
   - name: "setup-network-monitor"
     action: "enable"
     mandatory: false
   - name: "ci-os-first-boot-setup"
     action: "enable"
     mandatory: false
   - name: "ci-os-first-boot-setup.timer"
     action: "enable"
     mandatory: false
