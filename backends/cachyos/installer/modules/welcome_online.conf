#
# Configuration for the welcome module. Derived from the pinned installer's modules/welcome_online.conf. Differences:
#   internetCheckUrl  https://wiki.cachyos.org -> https://example.com. The check is one HTTP GET, and the install is blocked
#                     while it fails (`required` below). A CachyOS host would make Companion OS depend on a site it does not
#                     control; the project's own domain would tell its operator who installs when. example.com (IANA) is
#                     neutral, always up and learns nothing but an IP address.
#   showKnownIssuesUrl  false: no known-issues page exists for this edition (branding.desc sets no knownIssuesUrl either).
# The GeoIP lookup (language preselection) is the installer's default: geoip.kde.org, a KDE service. It is the one third-party
# host besides the package mirrors that this installer contacts; see installer/README.md ("Network endpoints").
---
showSupportUrl:         true
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
showDonateUrl:          false

requirements:
    requiredStorage:    8.0
    requiredRam:        2.5
    internetCheckUrl:   https://example.com
    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    required:
        - ram
        - internet

geoip:
    style:    "xml"
    url:      "https://geoip.kde.org/v1/ubiquity"
    selector: "CountryCode"
