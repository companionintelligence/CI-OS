#
# Configuration for the plymouthcfg module: `plymouth-set-default-theme <theme>` in the target. The pinned installer picks
# a second theme on AMD GPUs (plymouth_theme_amdgpu); the Companion OS theme is one theme for every GPU, so both keys name it.
# The theme directory (/usr/share/plymouth/themes/companion-os) is carried into the target by scripts/ci-os-stage-target.sh
# (contract.env CI_INSTALLED_PLYMOUTH_THEME). If it is missing the job's command fails and Plymouth falls back to its stock
# theme, whose spinner carries the Arch Linux wordmark: the launcher's guards and the stager warn about that loudly.
---
plymouth_theme: companion-os
plymouth_theme_amdgpu: companion-os
