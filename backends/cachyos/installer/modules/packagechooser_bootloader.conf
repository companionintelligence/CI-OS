#
# Configuration for the bootloader chooser. One item, preselected. Why a chooser at all is in settings.conf: the installer's
# pacstrap job stops with "No bootloader selected" when this page did not store a value.
# The picture of the item. Not Calamares' built-in placeholder (:/images/no-selection.png: a blue zip-archive icon in a white square, which is
# what the page showed on ISO #4), and not the pinned installer's bootloader screenshots (they show CachyOS' theme): the Companion mark,
# rendered at build time by render-installer-assets.sh into the branding directory that calamares-online.sh copies to
# /usr/share/calamares/branding/companion/. The path is absolute because the module resolves a relative one against this file's directory.
---
mode: required

method: legacy

labels:
    step: "Bootloader"

default: grub

items:
    - id: grub
      name: "GRUB"
      description: "GRUB boots Companion OS on BIOS and UEFI computers, finds other operating systems on the disk and supports encrypted and Btrfs root filesystems."
      screenshot: "/usr/share/calamares/branding/companion/bootloader.png"
