#
### pacstrap module: installs the base system, then copies files from the live system into it.
#
# Derived from the pinned installer's modules/pacstrap.conf (cachyos-calamares-next 3.4.2-13). Differences, and why:
#   - basePackages loses cachyos-plymouth-bootanimation and cachyos-plymouth-theme: CachyOS' boot-animation artwork. The
#     Companion OS theme (contract.env CI_INSTALLED_PLYMOUTH_THEME) is carried into the target by
#     scripts/ci-os-stage-target.sh before the plymouthcfg job runs. `plymouth` itself stays.
#   - postInstallFiles loses /etc/calamares/scripts/enable-ufw: this edition has no firewall step (README, "Firewall"), and
#     nothing would remove the copy afterwards (the step that does is dropped from settings.conf).
# What pacstrap/main.py adds in CODE and this file cannot change (guarded in guards.list, handled by
# scripts/ci-os-post-install-fixups.sh): the kernels linux-cachyos{,-lts}{,-headers}, grub + grub-hook +
# cachyos-grub-theme + os-prober for GRUB, intel-ucode / amd-ucode, ZFS / Btrfs extras.
---
basePackages:
  - base
  - base-devel
  - btrfs-progs
  - cachyos-hooks
  - cachyos-keyring
  - cachyos-mirrorlist
  - cachyos-v4-mirrorlist
  - cachyos-v3-mirrorlist
  - cachyos-rate-mirrors
  - cachyos-settings
  - cryptsetup
  - device-mapper
  - diffutils
  - dosfstools
  - e2fsprogs
  - efibootmgr
  - exfatprogs
  - f2fs-tools
  - inetutils
  - jfsutils
  - less
  - linux-firmware
  - logrotate
  - lsb-release
  - lvm2
  - man-db
  - man-pages
  - mdadm
  - chwd
  - mkinitcpio
  - netctl
  - os-prober
  - perl
  - python
  - s-nail
  - sudo
  - sysfsutils
  - texinfo
  - usbutils
  - which
  - xfsprogs
  - plymouth

# Files copied from the live system into the same path of the target after pacstrap (missing files are skipped).
postInstallFiles:
  - "/etc/mkinitcpio.conf"
  - "/etc/calamares/scripts/dmcheck"
  - "/usr/local/bin/remove-nvidia"
  - "/etc/calamares/scripts/bootloader-post-setup"
  - "/etc/calamares/scripts/shell-setup"
  - "/etc/calamares/scripts/btrfs-installation-snapshot"
