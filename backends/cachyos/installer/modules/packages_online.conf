#
# Configuration for the packages job (instance packages@online). Derived from the pinned installer's
# modules/packages_online.conf (same pacman settings), plus `operations:` -- the Companion OS core tier.
#
# Why `operations` and not netinstall.yaml: the packages job appends netinstall's selection (globalstorage
# packageOperations) to the operations of THIS file (packages/main.py, run(): `operations += globalstorage
# packageOperations`), so these install on every install whatever the user unticks on the "Additional packages"
# page, and a second packages instance (which would re-run the whole netinstall selection) is not needed.
# They install in ONE pacman transaction, after the job's `pacman -Sy` + `pacman -Su` of the target.
#
# What each block is for (the same split the Ubuntu edition bakes into its image; Arch packages never start a
# service, so units are enabled by modules/services-systemd.conf and the payload stager):
#   containers   Docker engine, compose v2 and buildx for CI-Hub (core/lib/ci-hub.sh runs `docker compose`).
#                backends/arch/provision/provision.sh install_docker() returns early when docker is already
#                installed, WITHOUT enabling docker.service: services-systemd.conf does that.
#   setup portal core/headless/payload runtime: hostapd, dnsmasq, nginx, Flask under gunicorn, `iw`, NetworkManager's
#                nmcli (netinstall's Network group). Same list as ARCH_DEPS in backends/arch/headless-setup/install.sh
#                plus `iw`. `python`, `iproute2`, `util-linux` (rfkill) and `iputils` are in the base system.
#   core tools   jq, curl and openssl (core/lib/ci-hub.sh), tailscale, cloudflared, github-cli, and Ollama with its
#                Vulkan backend (provision.sh install_ollama() is a no-op once `ollama` exists, so no `curl | sh`).
#                CUDA and ROCm builds of Ollama are opt-in groups on the netinstall page.
# Everything here was checked against archlinux.org (extra) the day it was written: see
# iso/tests/installer-fixtures/packages.json. calamares-online.sh re-checks every name with `pacman -Si` before it
# starts the installer, because a package that disappears would otherwise fail the install after the disk is written.
---
backend: pacman
skip_if_no_internet: false
update_db: true
update_system: true
pacman:
    num_retries: 6
    disable_download_timeout: true
    needed_only: true

operations:
    - install:
        - docker
        - docker-compose
        - docker-buildx
        - hostapd
        - dnsmasq
        - nginx
        - python-flask
        - gunicorn
        - iw
        - jq
        - curl
        - openssl
        - tailscale
        - cloudflared
        - github-cli
        - ollama
        - ollama-vulkan
