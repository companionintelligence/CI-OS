#
# Calamares settings for the Companion OS installer. Derived from usr/share/calamares/settings_online.conf of the pinned
# installer (cachyos-calamares-next 3.4.2-13); calamares-online.sh writes this file to /etc/calamares/settings.conf (the stock
# launcher copies settings_online.conf there).
#
# Differences from settings_online.conf, and why (lib/ci-guards.sh `settings-drift` fails closed on any OTHER step the
# installer GAINS, and on a sequence it cannot read or that lacks the steps this file is built around, so a change upstream is
# reviewed, not inherited by accident. A step the installer drops that this file still runs is not judged: the `settings` guard
# fails when the module behind it is gone, and running a step upstream stopped listing is harmless):
#   dropped   packagechooser@desktop   Plasma is the only desktop (decision D2); the Plasma packages are an always-on group
#                                      in modules/netinstall.yaml instead of a chooser answer.
#   dropped   shellprocess@enable_ufw  no host firewall (installer/README.md, "Firewall"): nothing for the step to enable.
#   dropped   shellprocess@greetd      only does anything when noctalia-greeter is installed.
#   kept      packagechooser@bootloader, with GRUB as its only item: pacstrap/main.py aborts when the chooser left no value
#                                      (it reads global storage `packagechooser_bootloader`), and bootloader.conf reads the
#                                      same key. One preselected item, one click on Next.
#   added     shellprocess@ci_os_stage      right after packages@online: payload, first-boot unit, os-release hook, brand
#                                           assets (scripts/ci-os-stage-target.sh). Before plymouthcfg / grubcfg, which need
#                                           the Companion OS themes to exist, and before services-systemd, which enables units.
#   added     shellprocess@ci_os_fixups     after the stock shellprocess: fix-ups of CachyOS hard-codes that no config reaches
#                                           (scripts/ci-os-post-install-fixups.sh).
#   changed   branding: companion
# No comment lines inside `sequence:` -- lib/ci-guards.sh reads it with awk.
---
modules-search: [ local ]

instances:

- id:       online
  module:   packages
  config:   packages_online.conf

- id:       online
  module:   welcome
  config:   welcome_online.conf

- id:       before-online
  module:   shellprocess
  config:   shellprocess-before-online.conf

- id:       modify_mk_hook
  module:   shellprocess
  config:   shellprocess_modify_mk_hook.conf

- id:       reset_mk_hook
  module:   shellprocess
  config:   shellprocess_reset_mk_hook.conf

- id:       initialize_pacman
  module:   shellprocess
  config:   shellprocess_initialize_pacman.conf

- id:       bootloader
  module:   packagechooser
  config:   packagechooser_bootloader.conf

- id:       btrfs_snapshot
  module:   shellprocess
  config:   shellprocess_btrfs_snapshot.conf

- id:       cleanup_calamares
  module:   shellprocess
  config:   shellprocess_cleanup_calamares.conf

- id:       ci_os_stage
  module:   shellprocess
  config:   shellprocess_ci_os_stage.conf

- id:       ci_os_fixups
  module:   shellprocess
  config:   shellprocess_ci_os_fixups.conf


sequence:
- show:
  - welcome@online
  - locale
  - keyboard
  - packagechooser@bootloader
  - partition
  - netinstall
  - users
  - summary
- exec:
  - partition
  - zfs
  - mount
  - shellprocess@modify_mk_hook
  - shellprocess@initialize_pacman
  - shellprocess@before-online
  - pacstrap
  - machineid
  - users
  - locale
  - keyboard
  - localecfg
  - chwd
  - packages@online
  - shellprocess@ci_os_stage
  - luksbootkeyfile
  - luksopenswaphookcfg
  - fstab
  - plymouthcfg
  - zfshostid
  - initcpiocfg
  - initcpio
  - networkcfg
  - displaymanager
  - hwclock
  - grubcfg
  - bootloader
  - shellprocess@reset_mk_hook
  - services-systemd
  - shellprocess
  - shellprocess@ci_os_fixups
  - shellprocess@btrfs_snapshot
  - shellprocess@cleanup_calamares
  - umount
- show:
  - finished

branding: companion

prompt-install: true

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: true

quit-at-end: false
