# The functional lines of Arch's stock /etc/nginx/nginx.conf (nginx 1.30.5-1, read from the package); comments and blank lines removed.
# Why it is here: it has no include of conf.d (installer-stage.sh checks that stage-headless.sh adds one).
worker_processes  1;
include modules.d/*.conf;
events {
    worker_connections  1024;
}
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    server {
        listen       80;
        server_name  localhost;
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
