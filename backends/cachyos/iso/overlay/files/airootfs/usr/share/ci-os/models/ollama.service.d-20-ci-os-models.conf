# Companion OS: drop-in for the packaged ollama.service, installed as
#   /etc/systemd/system/ollama.service.d/20-ci-os-models.conf
#
# Puts the models on the Companion Stick's CI-CACHE volume when it is attached and leaves Ollama on its default
# directory when it is not. /usr/libexec/ci-os/ollama-models-env is backends/ubuntu/chroot/payload/ci-os-ollama-models-env.sh
# (it mounts the volume for the 'ollama' user, writes /run/ollama/ci-models.env with OLLAMA_MODELS, OLLAMA_NOPRUNE=1 and,
# with /usr/bin/ci-os-models installed, the Hugging Face / llama.cpp variables, and never fails the unit).
[Service]
RuntimeDirectory=ollama
RuntimeDirectoryMode=0755
ExecStartPre=-+/usr/libexec/ci-os/ollama-models-env
ExecStopPost=-+/usr/libexec/ci-os/ollama-models-env release
EnvironmentFile=-/run/ollama/ci-models.env
