# Companion OS memory protection: user.slice, the desktop session and everything the person started. [I]
#
# Why: the session is what the person is looking at, so a machine that runs short of memory should take it back from background work
# first and from the session last. MemoryLow is a soft floor: it is given back before the kernel kills anything, so it cannot make a bad
# situation worse. The share is of installed RAM, resolved by systemd when it loads the unit.
#
# Status: a proposal, [I] implemented and not proven (see system.slice.d/30-ci-os-memory.conf). On a machine whose GPU shares system
# memory, the RAM the system sees is what is left after the GPU's share, and whether GPU buffers are charged to a cgroup there is UNKNOWN.
# Off-switch: delete this file (on the CachyOS edition also its line in usr/share/ci-os/installed/carry-over.list).
[Slice]
MemoryLow=25%
