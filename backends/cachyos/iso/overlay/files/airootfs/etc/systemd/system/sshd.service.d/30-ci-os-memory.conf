# Companion OS memory protection: the SSH daemon (ssh.service on Ubuntu, sshd.service on CachyOS). [I]
#
# Why: a person who has to look at a machine that is out of memory needs a way in. MemoryMin is a hard floor: the kernel does not take
# back the memory of this unit while it is below the floor, so a login still works while the desktop is thrashing. The daemon uses a
# few tens of MiB, so 1% of RAM almost never binds, and it stays far below the level where protecting too much starts to kill other
# processes. The floor only holds if system.slice allows it too (system.slice.d/30-ci-os-memory.conf).
#
# Limit: connections that systemd starts one by one (sshd@.service, when a socket is set to Accept=yes) live in system-sshd.slice, which
# has no protection of its own; this file covers the one daemon unit. verify-iso.sh prints which mode the packaged ssh.socket uses.
# Status: a proposal, [I] implemented and not proven.
# Off-switch: delete this file (on the CachyOS edition also its line in usr/share/ci-os/installed/carry-over.list).
[Service]
MemoryMin=1%
