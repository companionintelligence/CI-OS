# Companion OS memory protection: system.slice, the system daemons and the containers. [I]
#
# Why: when memory runs short the kernel takes it back from whatever is not protected. A service's own MemoryMin or MemoryLow only
# counts up to what every parent slice also allows, so this slice carries the allocations of the services inside it (the SSH daemon and
# the container engine) and keeps a share for the rest. MemoryMin is a hard floor that is never reclaimed; MemoryLow is a soft floor
# that is given back before anything is killed. The slice must hold more than the sum of what its children claim, or their values are
# not fully effective.
#
# The values are shares of installed RAM, which systemd resolves when it loads the unit: no first-boot step, and a small machine is not
# starved. They are proposals: [I] implemented, not proven. No image with them has been booted yet; the 6 and 16 GiB VM runs of
# docs/guides/testing-in-qemu.md settle what the kernel does with them. core/lib/memory-protection.sh keeps the numbers consistent.
#
# Limit: containers run as docker-<id>.scope units inside this slice, so they share these allocations; none is protected on its own.
# Off-switch: delete this file (on the CachyOS edition also its line in usr/share/ci-os/installed/carry-over.list).
[Slice]
MemoryMin=2%
MemoryLow=10%
