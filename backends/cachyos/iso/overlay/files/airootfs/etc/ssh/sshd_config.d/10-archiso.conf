# Companion OS live medium: sshd is masked (etc/systemd/system/sshd.service and sshd.socket point at /dev/null).
# The upstream live profile allowed root to log in with an empty password; if somebody unmasks sshd on a running
# live system it must not do that: no root login, no password logins (use a key).
PermitRootLogin no
PasswordAuthentication no
